        <nav>${PAGES.map(([k, ic, l]) => `<button class="nav ${page === k || (page === 'member' && k === 'members') ? 'on' : ''}" data-page="${k}"><span class="ic">${ic}</span>${l}${k === 'perks' && urgent ? `<span class="cnt ${count('overdue') ? 'red' : ''}">${urgent}</span>` : ''}</button>`).join('')}</nav>
        <div class="sidefoot">このPC：${h(storage.deviceName())}<br>CSVは画面のどこにでもドロップできます</div>
      </aside>
      <section class="mainarea">
        <header class="pagehead"><h1>${title}</h1>
          <div class="actions">${csvBadge()}${page === 'dashboard' ? '' : '<button class="btn primary" id="extraBtn">＋特典を追加</button><button class="btn ghost" id="csvBtn">CSV取込</button>'}</div></header>
        <div id="banner"></div>
        <div id="page">${renderPage(list)}</div>
      </section>
    </div>`;
  wire(list);
}

function csvBadge() {
  const last = latestCsvLog(data);
  if (!last) return '<span class="lastcsv warn">CSV未取込</span>';
  const at = new Date(last.at);
  const local = `${at.getFullYear()}-${String(at.getMonth() + 1).padStart(2, '0')}-${String(at.getDate()).padStart(2, '0')}`;
  const ago = -daysTo(local);
  return `<span class="lastcsv ${ago > 35 ? 'warn' : ''}" title="${h(last.device)}で取込">最終取込 ${md(local)}（${ago === 0 ? '今日' : ago + '日前'}）</span>`;
}

function renderPlans() {
  const plans = [...data.settings.plans].sort((a, b) => b.order - a.order);
  const old = data.settings.planPerksBefore;
  const ver = planVer || (old && today <= old.until ? 'old' : 'new');
  const at = ver === 'old' && old ? old.until : null;   // null = 新の内容
  const perk = x => `<li>${h(x.name)}${x.rule ? ' <span class="tracked">リストで管理</span>' : ''}</li>`;
  const verBar = old ? `<div class="verbar"><button class="verbtn ${ver === 'old' ? 'on' : ''}" data-ver="old">〜${md(old.until)}（旧）</button><button class="verbtn ${ver === 'new' ? 'on' : ''}" data-ver="new">${md(addDays(old.until, 1))}〜（新）</button>
    <span class="muted small">${today <= old.until ? `今は旧の内容です。${md(addDays(old.until, 1))}から全員が新の内容になります。` : '今は新の内容です。'}</span></div>` : '';
  return `${verBar}<p class="muted small">上位プランは、下位プランの特典もすべて受けられます（例外は「対象外」と書いたもの）。「リストで管理」の特典は、「渡すもの」で期限を管理しています。</p>
    <div class="plangrid">${plans.map(p => {
      const x = perksForPlan(data.settings, p.id, at);
      const pn = id => h((planById(data.settings, id) || {}).name || id);
      return `<section class="panel plancard" id="plan-${p.id}" style="--c:${PLAN_COLORS[p.id] || '#777'}">
        <div class="pc-head"><b>${h(p.name)}</b><span>${yen(p.price)}/月</span></div>
        <h4>★ ${h(p.name.replace(/プラン$/, ''))}の特典</h4><ul class="plain">${x.own.map(perk).join('') || '<li class="muted">なし</li>'}</ul>
        ${x.inherited.map(g => `<h4>▼ ${pn(g.planId)}から</h4><ul class="plain">${g.perks.map(perk).join('')}</ul>`).join('')}
        ${x.notes.length ? x.notes.map(n => `<p class="small excl">※ ${h(n)}</p>`).join('') : ''}
        ${x.excluded.length ? `<p class="small excl">対象外：${x.excluded.map(e => h(e.name)).join('、')}</p>` : ''}
        <div class="pc-tenure">🎁 12か月継続特典：<b>${h(x.tenure)}</b></div></section>`;
    }).join('')}</div>`;
}

function renderPage(list) {
  if (page === 'plans') return renderPlans();
  if (page === 'perks') return `<section id="list" class="panel">${renderList(list)}</section>`;
  if (page === 'members') return `<section class="panel"><div id="tabContent">${renderFans()}</div></section>`;
  if (page === 'records') return `<section class="panel"><div id="tabContent">${renderRecords()}</div></section>`;
  if (page === 'revenue') return `<section class="panel"><div id="tabContent">${renderRevenue()}</div></section>`;
  if (page === 'settings') return renderSettings();
  if (page === 'member') return renderMember();
  return renderDashboard(list);
}

function renderDashboard(list) {
  const fans = Object.values(data.fans);
  const active = fans.filter(f => f.status === 'active');
  const count = s => list.items.filter(i => i.status === s).length;
  const monthly = active.reduce((sum, f) => sum + ((planById(data.settings, planOn(f, today)) || {}).price || 0), 0);
  const urgent = sortItems(list.items.filter(i => i.status === 'overdue' || i.status === 'thisMonth'), 'due', fanName);
  const soon = addMonths(today, 2);
  const milestones = [];
  for (const f of active) for (const r of data.settings.rules.filter(r => r.kind === 'tenure')) {
    const d = reachDate(f, r.months);
    if (d && compare(d, today) >= 0 && compare(d, soon) <= 0) milestones.push({ f, months: r.months, d, label: tenureLabel(r, planOn(f, d), today) });
  }
  milestones.sort((a, b) => compare(a.d, b.d));
  const recent = addMonths(today, -1);
  const newcomers = fans.filter(f => f.status !== 'left' && compare(f.periods.at(-1).start, recent) >= 0);
  const candidates = fans.filter(f => f.status === 'leftCandidate');
  const planRows = data.settings.plans.map(p => ({ p, n: active.filter(f => planOn(f, today) === p.id).length }));
  const maxN = Math.max(1, ...planRows.map(x => x.n));
  const prog = monthProgress(data, today);
  const pct = prog.total ? Math.round((prog.done / prog.total) * 100) : 100;
  const R = 34, C = 2 * Math.PI * R;
  const ring = `<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" class="ring-bg"/><circle cx="42" cy="42" r="${R}" class="ring-fg" stroke-dasharray="${(C * pct) / 100} ${C}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle">${pct}%</text></svg>`;
  const pending = count('thisMonth');
  const who = f => `<button class="link fanlink" data-id="${h(f.memberNo)}">${h(f.name)}</button>`;
  return `
    <section class="hero">
      <div class="hero-main"><span class="hero-label">今月渡すもの</span>
        <div class="hero-num"><b>${pending}</b><span>件</span>${count('overdue') ? `<em>期限切れ ${count('overdue')}件</em>` : ''}</div>
        <button class="btn primary big" data-goto="perks">渡すものを見る</button></div>
      <div class="hero-ring">${ring}<span>今月 ${prog.total}件中 ${prog.done}件 済</span></div>
    </section>
    <div class="qas">
      <button class="qa" id="qaExtra"><span>＋</span>特典を追加</button>
      <button class="qa" id="qaCsv"><span>⇪</span>CSV取込</button>
      <button class="qa" data-goto="members"><span>🔍</span>会員を探す</button>
      <button class="qa" data-goto="plans"><span>📋</span>プラン特典</button>
    </div>
    <div class="kpis small-kpis"><span>在籍 <b>${active.length}人</b></span><span>月額収益 <b>${yen(monthly)}</b></span></div>
    ${renderCalendar()}
    ${renderNotices(list.notices)}
    <div class="dashgrid">
      <section class="panel span2"><div class="secthead"><h2>⚠ 急ぎ（期限切れ・今月）</h2><button class="link" data-goto="perks">すべて見る →</button></div>
        <div id="dashUrgent">${urgent.length ? urgent.slice(0, 5).map(itemRow).join('') + (urgent.length > 5 ? `<button class="link morecount" data-goto="perks">ほか ${urgent.length - 5}件 → すべて見る</button>` : '') : '<div class="empty">急ぎの特典はありません 🎉</div>'}</div></section>
      <section class="panel"><h2>📅 もうすぐの節目</h2>${milestones.length ? `<ul class="dl">${milestones.slice(0, 8).map(m => `<li><span class="when">あと${daysTo(m.d)}日</span>${who(m.f)} ${badge(planOn(m.f, m.d))}<div class="muted small">${m.months}か月：${h(m.label)}（${ymd(m.d)}）</div></li>`).join('')}</ul>` : '<p class="muted">2か月以内に節目を迎える人はいません</p>'}</section>
      <section class="panel"><h2>👥 新規・退会候補</h2>
        <h4>新規（1か月以内） ${newcomers.length}人</h4>${newcomers.length ? `<p class="names">${newcomers.map(who).join('、')}</p>` : '<p class="muted small">なし</p>'}
        <h4>退会候補 ${candidates.length}人</h4>${candidates.length ? `<p class="names">${candidates.map(who).join('、')}</p><button class="link small" data-goto="members">会員名簿で確認する →</button>` : '<p class="muted small">なし</p>'}</section>
      <section class="panel span2"><h2>📊 プラン別の人数（在籍）</h2><div class="bars">${planRows.map(({ p, n }) => `<div class="bar"><span class="bl">${badge(p.id)}</span><span class="bt"><i style="width:${(n / maxN) * 100}%"></i></span><b>${n}人</b></div>`).join('')}</div></section>
    </div>`;
}

function renderCalendar() {
  const ym = calYm || today.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const items = computeList(data, today, { untilMonths: 14 }).items;
  const byDay = itemsByDay(items, ym);
  const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<span class="day empty"></span>');
  for (let d = 1; d <= days; d++) {
    const its = byDay[String(d)] || [], ds = `${ym}-${String(d).padStart(2, '0')}`;
    const bad = its.some(i => i.status === 'overdue');
    cells.push(`<button class="day ${its.length ? 'has' : ''} ${ds === today ? 'today' : ''} ${calDay === ds ? 'sel' : ''}" data-day="${ds}"><span>${d}</span>${its.length ? `<i class="${bad ? 'red' : ''}">${its.length > 1 ? its.length : ''}</i>` : ''}</button>`);
  }
  const sel = calDay && calDay.startsWith(ym) ? (byDay[String(Number(calDay.slice(8)))] || []) : [];
  return `<section class="panel" id="cal"><div class="secthead"><button class="link" id="calPrev">‹ 前の月</button><h2>${y}年${m}月</h2><button class="link" id="calNext">次の月 ›</button></div>
    <div class="cal-head">${['日', '月', '火', '水', '木', '金', '土'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div id="calDay">${calDay ? (sel.length ? `<h4>${md(calDay)} の渡すもの</h4>${sortItems(sel, 'due', fanName).map(itemRow).join('')}` : `<p class="muted small">${md(calDay)} に期限の特典はありません</p>`) : '<p class="muted small">日付を押すと、その日が期限の特典が出ます</p>'}</div></section>`;
}

function renderList(list) {
  const head = `<div class="listhead">${list.items.length ? `<div class="controls">
    <span class="ctl-label">種類</span><button class="kindchip ${listKind === 'all' ? 'on' : ''}" data-kind="all">すべて ${list.items.length}</button>${Object.entries(KIND_META).map(([k, m]) => { const n = list.items.filter(i => i.kind === k).length; return n ? `<button class="kindchip ${listKind === k ? 'on' : ''}" data-kind="${k}" style="--k:${m.color}">${m.icon}${m.label} ${n}</button>` : ''; }).join('')}
  </div>` : ''}</div>${list.items.length ? `<div class="controls planrow"><label class="sortsel">並べ替え <select id="listSort">${[['due', '期限順'], ['name', '名前順'], ['kind', '種類順']].map(([k, l]) => `<option value="${k}" ${listSort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label><span class="ctl-label">プラン</span><button class="planchip ${listPlan === 'all' ? 'on' : ''}" data-plan="all">すべて</button>${[...data.settings.plans].sort((a, b) => b.order - a.order).map(p => { const n = list.items.filter(i => itemPlan(i) === p.id).length; return n ? `<button class="planchip ${listPlan === p.id ? 'on' : ''}" data-plan="${p.id}" style="--c:${PLAN_COLORS[p.id] || '#777'}">${h(p.name.replace(/プラン$/, ''))} ${n}</button>` : ''; }).join('')}</div>` : ''}`;
  if (!list.items.length) return head + `<div class="empty">今月・来月に渡すものはありません 🎉</div>`;
  const shown = sortItems(filterItems(list.items, listKind).filter(i => listPlan === 'all' || itemPlan(i) === listPlan), listSort, fanName);
  return head + GROUPS.map(([st, label]) => {
    const its = shown.filter(i => i.status === st);
    if (!its.length) return '';
    return `<div class="group ${st}"><div class="glabel">${st === 'overdue' ? '⚠ ' : ''}${label}<span>${its.length}</span></div>${its.map(itemRow).join('')}</div>`;
  }).join('') || '<div class="empty">この種類の渡すものはありません</div>';
}

function itemPlan(i) {
  const f = data.fans[i.fanId] || {};
  return planOn(f, i.due) || planOn(f, today) || (f.planHistory || []).at(-1)?.planId;
}

function itemRow(i) {
  const f = data.fans[i.fanId] || {};
  const plan = itemPlan(i);
  const rule0 = data.settings.rules.find(r => r.id === i.ruleId);
  const meta = { ...(KIND_META[i.kind] || { icon: '・', label: '', color: '#777' }), ...(rule0 && rule0.icon ? { icon: rule0.icon } : {}) };
  const tags = [i.count > 1 ? `<span class="tag strong">${i.count}回分</span>` : '', i.scheduled ? '<span class="tag">予定</span>' : '', i.fanLeft ? '<span class="tag gray">退会済み</span>' : ''].join('');
  return `<div class="item st-${h(i.status)}" data-key="${h(i.key)}" data-kind="${h(i.kind)}" data-plan="${h(plan || '')}">
    <button class="check" title="渡した（押すだけで記録）" aria-label="渡した"></button>
    <div class="due">${i.scheduled ? '<small>予定</small>' : ''}${md(i.due)}</div>
    <div class="who"><button class="link fanlink namelink" data-id="${h(i.fanId)}">${h(f.name || i.fanId)}</button> ${badge(plan)}</div>
    <div class="what"><span class="kindtag" style="--k:${meta.color}">${meta.icon}</span>${h(i.title)} ${tags}</div>
    <button class="more" title="ほかの操作">…</button></div>`;
}

function renderNotices(n) {
  const parts = [];
  const bad = invalidDateFans(data);
  if (bad.length) parts.push(`<div class="notice warn-strong">⚠ 日付が読めないファンが${bad.length}人います（${bad.slice(0, 5).map(fanName).map(h).join('、')}${bad.length > 5 ? ' ほか' : ''}）。この人たちの特典はリストに出ません。v4のデータをもう一度読み込んでください。</div>`);
  if (n.missingBirthday.length) parts.push(`<div class="notice">🎂 誕生日が未入力の人：${n.missingBirthday.map(id => `<button class="link fanlink" data-id="${h(id)}">${h(fanName(id))}</button>`).join('、')}</div>`);
  for (const u of n.undecidedMilestones) parts.push(`<div class="notice">⭐ もうすぐ${u.months}か月の人がいます（${u.memberNos.map(id => `<button class="link fanlink" data-id="${h(id)}">${h(fanName(id))}</button>`).join('、')}）。${u.months}か月の特典を決めますか？ <button class="link" id="decide${u.months}">特典を決める</button></div>`);
  return parts.length ? `<section id="notices">${parts.join('')}</section>` : '';
}

function tenureMonths(f) {
  let m = 0;
  for (const p of f.periods) m += diffMonthsDays(p.start, p.end && compare(p.end, today) < 0 ? p.end : today).months;
  return m;
}

function renderFans() {
  return `<div class="rosterbar">${renderRosterControls()}</div><div id="rosterTable">${renderRosterTable()}</div>`;
}

const ROSTER_FILTERS = () => {
  const recent = addMonths(today, -1);
  return [['active', '在籍', f => f.status === 'active'], ['new', '新規（1か月以内）', f => f.status !== 'left' && compare(f.periods.at(-1).start, recent) >= 0],
    ['leftCandidate', '退会候補', f => f.status === 'leftCandidate'], ['left', '退会', f => f.status === 'left'], ['all', 'すべて', () => true]];
};
const curPlan = f => planOn(f, today) || f.planHistory.at(-1).planId;

function renderRosterControls() {
  const all = Object.values(data.fans);
  const filters = ROSTER_FILTERS();
  const pred = (filters.find(x => x[0] === fanFilter) || filters[0])[2];
  const base = all.filter(pred);
  const plans = [...data.settings.plans].sort((a, b) => b.order - a.order);
  return `<div class="rosterrow"><input id="rosterSearch" placeholder="🔍 名前で検索" value="${h(fanQuery)}">
      <div class="chips">${filters.map(([k, l, p]) => `<button class="chip ${fanFilter === k ? 'on' : ''}" data-filter="${k}">${l} ${all.filter(p).length}</button>`).join('')}</div></div>
    <div class="rosterrow"><span class="ctl-label">プラン</span><button class="planchip ${fanPlan === 'all' ? 'on' : ''}" data-plan="all">すべて ${base.length}</button>${plans.map(p => `<button class="planchip ${fanPlan === p.id ? 'on' : ''}" data-plan="${p.id}" style="--c:${PLAN_COLORS[p.id] || '#777'}">${h(p.name.replace(/プラン$/, ''))} ${base.filter(f => curPlan(f) === p.id).length}</button>`).join('')}</div>`;
}

function renderRosterTable() {
  const all = Object.values(data.fans);
  const filters = ROSTER_FILTERS();
  const pred = (filters.find(x => x[0] === fanFilter) || filters[0])[2];
  const q = fanQuery.trim().toLowerCase();
  const planOrder = id => (planById(data.settings, id) || { order: -1 }).order;
  const rows = sortFanRows(all.filter(pred).filter(f => fanPlan === 'all' || curPlan(f) === fanPlan).filter(f => !q || f.name.toLowerCase().includes(q) || String(f.memberNo) === q).map(f => {
    const cur = curPlan(f);
    const next = data.settings.rules.filter(r => r.kind === 'tenure').map(r => reachDate(f, r.months)).filter(d => d && compare(d, today) >= 0).sort()[0] || null;
    return { f, memberNo: f.memberNo, name: f.name, plan: planOrder(cur), planId: cur, status: ['active', 'leftCandidate', 'left'].indexOf(f.status), months: tenureMonths(f), next, birthday: f.birthday };
  }), fanSort.key, fanSort.dir);
  const cols = [['memberNo', 'No', 'num'], ['name', '名前', ''], ['plan', 'プラン', ''], ['status', '状態', ''], ['months', '在籍', 'r'], ['next', '次の継続特典', ''], ['birthday', '誕生日', '']];
  const arrow = k => (fanSort.key === k ? (fanSort.dir === 'asc' ? ' ▲' : ' ▼') : '');
  const body = rows.map(({ f, planId, months, next }) => `<tr data-plan="${h(planId)}"><td class="num">${h(f.memberNo)}</td>
      <td class="nm"><button class="link fanlink" data-id="${h(f.memberNo)}">${h(f.name)}</button></td><td>${badge(planId)}</td>
      <td><span class="st st-${f.status}">${STATUS_LABEL[f.status]}</span></td><td class="r">${months}か月</td>
      <td>${next ? `<b>あと${daysTo(next)}日</b> <span class="muted">（${ymd(next)}）</span>` : '<span class="muted">-</span>'}</td><td>${f.birthday ? f.birthday.replace('-', '/') : '<span class="muted">-</span>'}</td>
      <td>${f.status === 'leftCandidate' ? `<button class="btn small danger leftbtn" data-id="${h(f.memberNo)}">退会確定</button>` : ''}</td></tr>`).join('');
  return `<p class="muted small rostercount">表示中 ${rows.length}人 ／ 在籍 ${all.filter(f => f.status === 'active').length}人</p>
    ${body ? `<div class="scroll tall"><table class="fans roster"><thead><tr>${cols.map(([k, l, c]) => `<th class="sortable ${c}" data-key="${k}">${l}${arrow(k)}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty">該当するファンはいません</div>'}`;
}

function recordTitle(r) {
  if (r.title) return r.title;
  const rule = ruleOf(r.key);
  if (!rule) { const m = r.key.match(/^tenure-(\d+)/); return m ? `${m[1]}か月継続` : r.key; }
  return rule.kind === 'tenure' ? `${rule.months}か月継続` : rule.label;
}

// その記録が「どのプランの特典か」：通話はそのプランの特典、継続特典は節目の日のプラン、ほかは渡した日のプラン
function recordPlan(r) {
  const f = data.fans[r.fanId];
  if (!f) return null;
  const rule = ruleOf(r.key);
  if (rule && rule.kind === 'interval' && rule.planIds.length === 1) return rule.planIds[0];
  if (rule && rule.kind === 'tenure') { const d = reachDate(f, rule.months); if (d && planOn(f, d)) return planOn(f, d); }
  return planOn(f, r.date || today) || (f.planHistory.at(-1) || {}).planId || null;
}

function renderRecords() {
  const recs = Object.values(data.records).filter(r => !r.deleted && (r.type === 'delivered' || r.type === 'dismissed'))
    .sort((a, b) => compare(b.date || b.updatedAt, a.date || a.updatedAt) || compare(b.updatedAt, a.updatedAt));
  if (!recs.length) return '<div class="empty">まだ記録はありません</div>';
  return `<div class="scroll"><table><thead><tr><th>渡した日</th><th>名前</th><th>内容</th><th>メモ</th><th>記録したPC</th><th></th></tr></thead><tbody>${recs.map(r => `
    <tr class="record"><td>${r.type === 'dismissed' ? '<span class="tag gray">対象外</span>' : ymd(r.date)}</td><td><button class="link fanlink" data-id="${h(r.fanId)}">${h(fanName(r.fanId))}</button></td>
    <td class="content">${badge(recordPlan(r))} ${h(recordTitle(r))}${r.variant ? `（${h(r.variant)}）` : ''}${r.minutes ? ` ${r.minutes}分` : ''}${(r.coversKeys || []).length ? ` <span class="tag">${r.coversKeys.length + 1}回分</span>` : ''}</td>
    <td>${h(r.memo)}</td><td class="muted">${h(r.device)}</td>
    <td class="nowrap"><button class="btn small ghost editrec" data-id="${h(r.id)}">修正</button><button class="btn small ghost delrec" data-id="${h(r.id)}">削除</button></td></tr>`).join('')}</tbody></table></div>`;
}

function renderRevenue() {
  const active = Object.values(data.fans).filter(f => f.status === 'active');
  const byPlan = data.settings.plans.map(p => { const n = active.filter(f => planOn(f, today) === p.id).length; return { p, n, sum: n * p.price }; });
  const total = byPlan.reduce((s, x) => s + x.sum, 0);
  const support = f => f.planHistory.reduce((s, ph) => {
    if (compare(ph.start, today) > 0) return s;
    const end = ph.end && compare(ph.end, today) < 0 ? ph.end : today;
    const p = planById(data.settings, ph.planId);
    return s + (diffMonthsDays(ph.start, end).months + 1) * (p ? p.price : 0);
  }, 0);
  const fans = Object.values(data.fans).map(f => ({ f, s: support(f) })).sort((a, b) => b.s - a.s);
  return `<div class="grid2"><div><h3>プラン別（在籍中）</h3><table><tbody>${byPlan.map(x => `<tr><td>${badge(x.p.id)}</td><td>${yen(x.p.price)}</td><td>${x.n}人</td><td class="r"><b>${yen(x.sum)}</b></td></tr>`).join('')}
    <tr class="total"><td colspan="3">月額合計</td><td class="r"><b>${yen(total)}</b></td></tr></tbody></table>
    <p class="muted small">支援額はプランの在籍月数（開始月を含む）× 月額で計算した目安です。</p></div>
    <div><h3>ユーザー別 累計支援額</h3><div class="scroll short"><table><tbody>${fans.map(({ f, s }) => `<tr><td><button class="link fanlink" data-id="${h(f.memberNo)}">${h(f.name)}</button></td><td>${STATUS_LABEL[f.status]}</td><td class="r">${yen(s)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

  if ($('#calPrev')) { $('#calPrev').onclick = () => shiftMonth(-1); $('#calNext').onclick = () => shiftMonth(1); }

    : page === 'dashboard' ? computeList(data, today, { untilMonths: 14 }).items : [];
  const byKey = Object.fromEntries([...list.items, ...extraItems].map(i => [i.key, i]));

// ---------- files ----------
document.addEventListener('change', e => { if (e.target.id === 'csvInput' && e.target.files[0]) { handleFile(e.target.files[0]); e.target.value = ''; } });

async function handleFile(file) {
  const text = await file.text();
  if (/\.csv$/i.test(file.name)) return previewCsv(text);
  let json;
  try { json = JSON.parse(text); } catch (e) { return alert('読み込めないファイルです'); }
  if (json && json.config && json.state) return previewV4(json);
  if (json && json.version === 5) return openDialog('書き出したデータを読み込む', '<p>このファイルの内容を今のデータと合体させます（どちらかにしかない記録はすべて残ります）。</p>',
    { ok: '読み込む', onOk: async () => { if (data) await storage.backup(data, 'import'); return commit(mergeData(data, json)); } });
  alert('対応していないファイルです（CreatiaのCSV、v4の書き出しデータ、v5の書き出しデータに対応）');
}

function previewCsv(text) {
  if (!data) return alert('先に「v4のデータを読み込む」か「新しく始める」を選んでください');
  const parsed = parseCreatiaCsv(text);
  if (!parsed.rows.length) return openDialog('このCSVは取り込めません', `<p>読み取れる行がありませんでした。CreatiaのファンリストCSVか確認してください。</p>${parsed.skipped.length ? `<div class="notice small">${parsed.skipped.map(s => h(`${s.line}行目：${s.reason}`)).join('<br>')}</div>` : ''}`);
  const keep = parsed.skipped.map(s => s.memberNo).filter(Boolean);
  const { data: next, summary } = applyCsv(data, parsed.rows, today, keep);
  const skipped = [...parsed.skipped.map(s => `${s.line}行目：${s.reason}`), ...summary.skipped.map(s => `会員番号${s.memberNo}：${s.reason}`)];
  const names = ids => ids.map(fanNameIn(next)).map(h).join('、');
  openDialog('CSVの取り込み', `<div class="csv-summary">
    <p>新規 <b>${summary.added.length}</b>人　退会候補 <b>${summary.leftCandidates.length}</b>人　再入会 <b>${summary.rejoined.length}</b>人　プラン変更 <b>${summary.planChanged.length}</b>人</p>
    ${summary.added.length ? `<p class="small">新規：${names(summary.added)}</p>` : ''}
    ${summary.leftCandidates.length ? `<p class="small">退会候補：${names(summary.leftCandidates)}</p>` : ''}
    ${summary.rejoined.length ? `<p class="small">再入会（在籍月数は続きから）：${names(summary.rejoined)}</p>` : ''}
    ${summary.planChanged.length ? `<p class="small">プラン変更：${names(summary.planChanged)}</p>` : ''}
    ${skipped.length ? `<div class="notice small">読み飛ばした行：<br>${skipped.map(h).join('<br>')}</div>` : ''}
    <p class="muted small">取り込む前の状態はバックアップされます（直近5回分）。</p></div>`,
    { ok: '取り込む', onOk: async () => { await storage.backup(data, 'csv'); return commit(addCsvLog(next, { rows: parsed.rows.length, added: summary.added.length, leftCandidates: summary.leftCandidates.length, rejoined: summary.rejoined.length, planChanged: summary.planChanged.length, skipped: skipped.length }, ctx())); } });
}
const fanNameIn = d => id => (d.fans[id] ? d.fans[id].name : id);

function previewV4(v4) {
  let res;
  try { res = migrateV4(v4, today, ctx()); } catch (e) { return alert(e.message); }
  const { data: migrated, report } = res;
  openDialog('v4のデータを読み込む', `<div class="csv-summary"><p>ファン <b>${report.fans}</b>人、記録 <b>${report.records}</b>件を引き継ぎます。</p>
    <p class="small">・今いる人の、今日より前に期限が来ていた入会時の特典・通話・誕生日は渡し済みとして扱います（ファンの詳細から1件ずつ「未渡し」に戻せます）<br>・12か月を過ぎているのに記録がない人は「期限切れ」に出ます<br>・ログイン情報は引き継ぎません</p>
    ${report.droppedFans.length ? `<div class="notice small">プランが読み取れず引き継げないファン：${report.droppedFans.map(h).join('、')}</div>` : ''}
    ${report.droppedPerkChecks ? `<p class="small muted">新しい特典ルールに当てはまらないプラン特典のチェック ${report.droppedPerkChecks}件は引き継ぎません。</p>` : ''}
    ${report.droppedSchedules ? `<p class="small muted">v4の通話予定 ${report.droppedSchedules}件は引き継ぎません（必要なら「予定日」で入れ直してください）。</p>` : ''}
    ${data ? '<p class="small">前回の読み込み分は今回の内容で上書きします。v5で付けた「渡した」などの記録はそのまま残ります。</p>' : ''}</div>`,
    { ok: '読み込む', onOk: async () => { if (data) await storage.backup(data, 'v4'); return commit(data ? mergeV4Import(data, migrated, new Date().toISOString()) : migrated); } });
}

// ---------- settings ----------
function renderSettings() {
  const rules = data.settings.rules.map(r => `<tr><td>${h(KIND_LABEL[r.kind])}${r.months ? `（${r.months}か月）` : ''}</td>
    <td>${h(r.label)}</td><td>${r.planIds.map(badge).join('')}</td><td class="nowrap"><button type="button" class="btn small ghost editrule" data-id="${h(r.id)}">編集</button></td></tr>`).join('');
  const tabs = [['basic', '基本・共有'], ['perks', '特典'], ['data', 'データ']];
  const bar = `<div class="settabs">${tabs.map(([k, l]) => `<button class="settab ${setTab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
  if (setTab === 'perks') return bar + `<section class="panel"><div class="secthead"><h2>特典ルール</h2><button type="button" class="btn small ghost" id="addRule">＋追加</button></div>
      <table><tbody>${rules}</tbody></table></section>
    <section class="panel"><div class="secthead"><h2>プラン特典の中身</h2><button type="button" class="btn small primary" id="savePerks">保存</button></div>
      <p class="muted small">ここで編集するのは12月からの新しい内容です。「上位にも」のチェックを外すと、上のプランには引き継がれません。</p>
      ${[...data.settings.plans].sort((a, b) => b.order - a.order).map(p => `<div class="perkplan" data-plan="${p.id}"><h4>${badge(p.id)} ${h(p.name)}</h4>
        ${((data.settings.planPerks || defaultPlanPerks())[p.id] || []).map((x, i) => `<div class="perkrow" data-i="${i}"><input name="perkname" value="${h(x.name)}"><label class="inline"><input type="checkbox" name="inherit" ${x.noInherit ? '' : 'checked'}> 上位にも</label>${x.rule ? '<span class="tracked">リストで管理</span>' : '<button type="button" class="link small delperk">削除</button>'}</div>`).join('')}
        <button type="button" class="link small addperk">＋特典を追加</button></div>`).join('')}</section>
    `;
  if (setTab === 'data') return bar + `<section class="panel"><h2>CSV取込の履歴</h2>${(() => { const logs = Object.values(data.records).filter(r => r.type === 'csvlog' && !r.deleted).sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 20);
      return logs.length ? `<table><thead><tr><th>日時</th><th>PC</th><th class="r">行数</th><th class="r">新規</th><th class="r">退会候補</th><th class="r">再入会</th><th class="r">プラン変更</th></tr></thead><tbody>${logs.map(l => { const d = new Date(l.at); return `<tr class="csvlog"><td>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</td><td>${h(l.device)}</td><td class="r">${l.counts.rows}</td><td class="r">${l.counts.added}</td><td class="r">${l.counts.leftCandidates}</td><td class="r">${l.counts.rejoined || 0}</td><td class="r">${l.counts.planChanged || 0}</td></tr>`; }).join('')}</tbody></table>` : '<p class="muted">まだ取り込んでいません</p>'; })()}</section>
    <section class="panel"><h2>データ</h2>
      <p class="small muted">保存先：${h(storage.folderName ? storage.folderName() : '')} の fan_data.json（バックアップは FC管理_バックアップ フォルダ）</p>
      <div class="row"><button type="button" class="btn ghost" id="exportBtn">データを書き出す</button><button type="button" class="btn ghost" id="importBtn">バックアップから読み込む</button></div></section>`;
  return bar + `<section class="panel"><h2>基本</h2>
      <label>ファンクラブ名<input name="club" value="${h(data.settings.clubName)}"></label>
      <label>このPCの名前（もう1台と区別するため）<input name="device" value="${h(storage.deviceName())}"></label>
      <button class="btn primary" id="saveSettings">保存</button></section>
    <section class="panel"><h2>もう1台のアカウントと共有</h2>
      ${storage.shareWith ? `<div class="row"><input id="shareEmail" type="email" placeholder="もう1台のGoogleアカウントのメールアドレス" style="flex:1"><button type="button" class="btn ghost" id="shareBtn">編集可能で共有</button></div>
      <p class="small muted">共有したら、もう1台のPCでツールを開いて「共有されたデータを開く」を押してください。</p>` : '<p class="muted small">このモードでは共有できません</p>'}
      ${storage.forgetFile ? '<p class="small"><button type="button" class="link" id="switchShared">共有されたデータに切り替える／ファイルを選び直す</button></p>' : ''}</section>
    `;
}

function wireSettings() {
  const d = $('#page');
  const on = (sel, fn) => { const el = d.querySelector(sel); if (el) el.onclick = fn; };
  d.querySelectorAll('.settab').forEach(b => b.onclick = () => { setTab = b.dataset.tab; render(); });
  on('#saveSettings', () => {
    const club = d.querySelector('[name=club]').value.trim(), dev = d.querySelector('[name=device]').value.trim();
    if (dev && dev !== storage.deviceName()) storage.setDeviceName(dev);
    if (club && club !== data.settings.clubName) return commit(withSettings(s => { s.clubName = club; }));
    render();
  });
  const sw = d.querySelector('#switchShared');
  if (sw) sw.onclick = () => { if (confirm('今開いているデータから離れて、Googleドライブのファイルを選び直します。よろしいですか？（データは消えません）')) { storage.forgetFile(); boot(); } };
  const sb = d.querySelector('#shareBtn');
  if (sb) sb.onclick = async () => {
    const email = d.querySelector('#shareEmail').value.trim();
    if (!/^[^@\s]+@[^@\s]+$/.test(email)) return alert('メールアドレスを入れてください');
    try { await storage.shareWith(email); alert(email + ' に共有しました（Googleから案内メールが届きます）'); } catch (e) { alert(e.message); }
  };
  d.querySelectorAll('.addperk').forEach(b => b.onclick = () => {
    const row = document.createElement('div'); row.className = 'perkrow'; row.dataset.i = 'new';
    row.innerHTML = '<input name="perkname" placeholder="特典の名前"><label class="inline"><input type="checkbox" name="inherit" checked> 上位にも</label><button type="button" class="link small delperk">削除</button>';
    b.before(row); row.querySelector('.delperk').onclick = () => row.remove(); row.querySelector('input').focus();
  });
  d.querySelectorAll('.delperk').forEach(b => b.onclick = () => b.closest('.perkrow').remove());
  on('#savePerks', () => {
    const cur = data.settings.planPerks || defaultPlanPerks();
    const next = {};
    d.querySelectorAll('.perkplan').forEach(pp => {
      const pid = pp.dataset.plan;
      next[pid] = [...pp.querySelectorAll('.perkrow')].map(r => {
        const old = r.dataset.i === 'new' ? {} : ((cur[pid] || [])[Number(r.dataset.i)] || {});
        const name = r.querySelector('[name=perkname]').value.trim();
        const item = { ...old, name };
        if (r.querySelector('[name=inherit]').checked) delete item.noInherit; else item.noInherit = true;
        return item;
      }).filter(x => x.name);
    });
    commit(withSettings(s => { s.planPerks = next; }));
  });
  on('#addRule', () => openRuleEditor(null, { kind: 'tenure', months: 24 }));
  d.querySelectorAll('.editrule').forEach(b => b.onclick = () => openRuleEditor(b.dataset.id));
  on('#exportBtn', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    a.download = `fan_data_export_${today}.json`; a.click();
  });
  on('#importBtn', () => $('#csvInput').click());
}

function withSettings(fn) {
  const next = JSON.parse(JSON.stringify(data));
  fn(next.settings);
  next.settings.updatedAt = new Date().toISOString();
  return next;
}

function openRuleEditor(ruleId, preset = {}) {
  const r = ruleId ? data.settings.rules.find(x => x.id === ruleId) : { id: '', kind: preset.kind || 'tenure', months: preset.months || 12, planIds: data.settings.plans.map(p => p.id), label: '', labelByPlan: {} };
  const planChecks = data.settings.plans.map(p => `<label class="inline"><input type="checkbox" name="plan" value="${p.id}" ${r.planIds.includes(p.id) ? 'checked' : ''}> ${h(p.name)}</label>`).join('');
  const perPlan = data.settings.plans.map(p => `<label class="inline-wide">${h(p.name)}<input name="lbp-${p.id}" value="${h((r.labelByPlan || {})[p.id] || '')}"></label>`).join('');
  const d = openDialog(ruleId ? '特典ルールを編集' : '特典ルールを追加', `
    <label>種類<select name="kind" ${ruleId ? 'disabled' : ''}>${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}" ${r.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="months">月数<input type="number" name="months" min="1" value="${h(r.months || '')}"></label>
    <label>特典名<input name="label" value="${h(r.label)}" placeholder="例：24か月継続特典"></label>
    <div class="field">対象プラン<br>${planChecks}</div>
    <div class="perplan"><div class="field">プランごとの特典名（継続◯か月のとき。空欄なら上の特典名）</div>${perPlan}</div>
    ${ruleId ? '<p><button type="button" class="btn small danger" id="delRule">このルールを削除</button></p>' : ''}`, {
    ok: '保存', wide: true, onOk: dl => {
      const kind = dl.querySelector('[name=kind]').value, months = Number(dl.querySelector('[name=months]').value) || null;
      const label = dl.querySelector('[name=label]').value.trim(), planIds = [...dl.querySelectorAll('[name=plan]:checked')].map(x => x.value);
      if (!label || !planIds.length || ((kind === 'interval' || kind === 'tenure') && !months)) { alert('特典名・対象プラン・月数を入れてください'); return false; }
      const labelByPlan = {};
      data.settings.plans.forEach(p => { const v = dl.querySelector(`[name=lbp-${p.id}]`).value.trim(); if (v) labelByPlan[p.id] = v; });
      const id = ruleId || (kind === 'tenure' ? `tenure-${months}` : `${kind}-${Date.now().toString(36)}`);
      if (!ruleId && data.settings.rules.some(x => x.id === id)) { alert('同じ月数の継続特典がすでにあります'); return false; }
      return commit(withSettings(s => {
        const nr = { ...(ruleId ? s.rules.find(x => x.id === ruleId) : {}), id, kind, label, planIds, ...(months ? { months } : {}), ...(kind === 'tenure' ? { labelByPlan } : {}) };
        if (ruleId) s.rules = s.rules.map(x => (x.id === ruleId ? nr : x)); else s.rules.push(nr);
      }));
    },
  });
  const sync = () => { const k = d.querySelector('[name=kind]').value; d.querySelector('.months').style.display = k === 'interval' || k === 'tenure' ? '' : 'none'; d.querySelector('.perplan').style.display = k === 'tenure' ? '' : 'none'; };
  d.querySelector('[name=kind]').onchange = sync; sync();
  const del = d.querySelector('#delRule');
  if (del) del.onclick = () => { if (confirm('このルールを削除しますか？（渡した記録は残ります）')) { d.close(); commit(withSettings(s => { s.rules = s.rules.filter(x => x.id !== ruleId); })); } };
}

function openExtra() {
  const fans = Object.values(data.fans).filter(f => f.status !== 'left').sort((a, b) => Number(a.memberNo) - Number(b.memberNo) || compare(a.memberNo, b.memberNo));
  const d = openDialog('特典を追加（ルーレット当選など）', `
    <label>内容<input name="title" placeholder="例：ルーレット当選：直筆チェキ" required></label>
    <label>いつまでに渡す<input type="date" name="due" value="${endOfMonth(today)}" required></label>
    <div class="field">誰に（複数選べます）<input id="fanSearch" placeholder="名前で絞り込み" style="display:block;width:100%;margin-top:4px"></div>
    <div class="fanpick">${fans.map(f => `<label class="inline-row"><input type="checkbox" name="fan" value="${h(f.memberNo)}"> ${h(f.name)} ${badge(planOn(f, today) || f.planHistory.at(-1).planId)}</label>`).join('')}</div>`, {
    ok: '追加する', wide: true, onOk: dl => {
      const ids = [...dl.querySelectorAll('[name=fan]:checked')].map(x => x.value);
      const title = dl.querySelector('[name=title]').value.trim(), due = dl.querySelector('[name=due]').value;
      if (!ids.length) { alert('渡す人を選んでください'); return false; }
      if (!title || !due) { alert('内容と期限を入れてください'); return false; }
      return commit(addExtra(data, ids, { title, due }, ctx()));
    },
  });
  d.querySelector('#fanSearch').oninput = e => {
    const q = e.target.value.trim();
    d.querySelectorAll('.fanpick label').forEach(l => { l.style.display = !q || l.textContent.includes(q) ? '' : 'none'; });
  };
}

if (typeof startApp === 'function') window.addEventListener('DOMContentLoaded', () => startApp(window.__TEST_DISK__ ? createMemoryStorage({ disk: window.__TEST_DISK__, deviceName: 'PC-TEST' }) : productionStorage()));
})();</script>
</body>
</html>
