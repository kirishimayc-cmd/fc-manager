<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://www.gstatic.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://www.googleapis.com https://content.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ファンクラブ管理ツール</title>
<style>:root{--wine:#8e2443;--wine-soft:#f8eef1;--ink:#26222a;--muted:#77707c;--line:#ebe5ea;--bg:#faf7f8;--warn:#b42318;font-family:system-ui,"Segoe UI","Yu Gothic UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}
h1{font-size:22px;margin:0 0 10px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:4px 0 10px}h4{font-size:14px;margin:16px 0 6px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 2px #2b1d240a,0 6px 20px #2b1d2408}
.actions,.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--wine);color:#fff}.btn.primary:hover{filter:brightness(1.1)}.btn.ghost{background:#fff;border-color:#ddd5db;color:var(--ink)}.btn.ghost:hover{background:var(--wine-soft)}
.btn.danger{background:var(--warn);color:#fff}.btn.small{padding:4px 9px;font-size:12px}.btn.big{padding:11px 20px;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--wine);text-decoration:underline;cursor:pointer;font:inherit}
.group{margin-top:6px}.glabel{font-size:12px;font-weight:700;color:var(--muted);padding:8px 2px 4px;border-bottom:1px solid var(--line)}.glabel span{margin-left:6px;background:#eee;border-radius:9px;padding:0 7px}
.group.overdue .glabel{color:var(--warn)}.group.overdue .glabel span{background:#fde7e5;color:var(--warn)}
.item{display:grid;grid-template-columns:34px 92px minmax(130px,180px) 1fr 34px;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid #f3eff2;border-radius:6px}.item:nth-child(even){background:#fcf9fa}
.item:hover{background:#fdfafb}.who{font-weight:600}.due{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}.due small{display:block;font-size:10px;color:#2f5aa0;font-weight:600}.group.overdue .due{color:var(--warn);font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:4px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);vertical-align:1px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;background:#eef3fb;color:#2f5aa0}.tag.strong{background:#fff1d6;color:#8a5a00;font-weight:700}.tag.gray{background:#eee;color:#666}
.empty{color:var(--muted);text-align:center;padding:22px}
#notices .notice,.notice{background:#fff8e6;border:1px solid #f3dfae;border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px}
.banner{background:#eef5ff;border:1px solid #c7dbf7;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between}.banner .x{border:0;background:none;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid #ddd5db;background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid #f1ecf0;text-align:left;vertical-align:middle}th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:#fff}
.scroll{max-height:460px;overflow:auto}.scroll.short{max-height:360px}.r{text-align:right}.num{color:var(--muted);font-variant-numeric:tabular-nums}.nowrap{white-space:nowrap}.nowrap .btn{margin-left:4px}.total td{border-top:2px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gate{max-width:560px;margin:70px auto;text-align:center;padding:30px}.gate p{line-height:1.8}.gate .row{justify-content:center;margin-top:16px}
dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);box-shadow:0 20px 60px #0003}dialog.wide{width:min(640px,94vw)}dialog::backdrop{background:#2a1a2266}
dialog form{padding:18px 20px}.dlg-body{max-height:65vh;overflow:auto}.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0}label input,label select{display:block;width:100%;margin-top:4px}
input,select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid #d8d0d6;border-radius:8px}label.inline{display:inline-flex;align-items:center;gap:4px;margin:4px 12px 4px 0;font-weight:500}label.inline input{width:auto;display:inline;margin:0}
label.inline-wide{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-weight:500}label.inline-wide input{margin:0}
.field{font-size:13px;font-weight:600;margin:8px 0}.field select{width:auto;display:inline-block;margin:0 4px}ul.plain{margin:0;padding-left:18px;font-size:13px;line-height:1.8}
.dropcover{display:none}body.dragging .dropcover{display:flex;position:fixed;inset:10px;border:3px dashed var(--wine);border-radius:16px;background:#fff9;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--wine);pointer-events:none;z-index:10}
@media(max-width:760px){.item{grid-template-columns:34px 1fr 34px}.item .due,.item .who{grid-column:2}.what{grid-column:2}.grid2{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
.notice.warn-strong{background:#fdecea;border-color:#f5b5ad;color:#8a1c12;font-weight:600}
.fanpick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}label.inline-row{display:flex;align-items:center;gap:6px;font-weight:500;margin:4px 0}label.inline-row input{width:auto;margin:0}
.listhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:4px}.listhead h2{margin:0}
.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.ctl-label{font-size:11px;color:var(--muted);margin:0 2px 0 8px}
.kindchip{border:1px solid #ddd5db;background:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.kindchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kindtag{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;margin-right:8px;background:#f3eef1;font-size:13px;vertical-align:middle}
.what{line-height:1.45}.group.overdue .item{background:#fff8f7}.group.overdue .item:nth-child(even){background:#fdf1ef}
table.fans th.sortable{cursor:pointer;user-select:none;white-space:nowrap}table.fans th.sortable:hover{color:var(--wine)}table.fans tbody tr:hover{background:#fdf6f8}table.fans td{padding:9px 8px}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}.st-active{background:#e9f6ee;color:#1e7a43}.st-leftCandidate{background:#fff1d6;color:#8a5a00}.st-left{background:#eee;color:#666}

.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:#2b1d24;color:#f3e9ee;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .club{font-weight:800;font-size:15px;color:#fff;padding:4px 10px 16px;border-bottom:1px solid #ffffff22;margin-bottom:10px;line-height:1.4}
.side nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#e8dbe1;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;cursor:pointer}
.nav:hover{background:#ffffff14}.nav.on{background:#ffffff;color:var(--wine);font-weight:700}.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;background:#ffffff2a;border-radius:999px;padding:0 8px;font-size:12px}.nav .cnt.red{background:#e0434f;color:#fff}.nav.on .cnt{background:#f3e3e8;color:var(--wine)}.nav.on .cnt.red{background:#e0434f;color:#fff}
.sidefoot{margin-top:auto;font-size:11px;color:#bfaab4;line-height:1.6;padding:0 8px}
.mainarea{padding:18px 26px 40px;max-width:1080px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pagehead h1{margin:0;font-size:21px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font:inherit;cursor:pointer}.kpi:hover{border-color:var(--wine)}
.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:26px;letter-spacing:.5px}.kpi.red b{color:var(--warn)}.kpi.red{background:#fff7f6;border-color:#f5c8c2}
.dashgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dashgrid .span2{grid-column:1/-1}.dashgrid .panel{margin:0}
.secthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.secthead h2{margin:0}

ul.dl{list-style:none;margin:0;padding:0}ul.dl li{padding:8px 0;border-bottom:1px solid #f3eff2}.when{display:inline-block;min-width:68px;font-weight:700;color:var(--wine)}
.names{line-height:1.9;margin:4px 0 8px}
.bars{display:flex;flex-direction:column;gap:8px}.bar{display:grid;grid-template-columns:70px 1fr 50px;align-items:center;gap:10px}.bt{background:#f3eef1;border-radius:6px;height:14px;overflow:hidden}.bt i{display:block;height:100%;border-radius:6px;background:var(--wine)}.bar b{text-align:right}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.side nav{flex-direction:row;flex-wrap:wrap}.nav{width:auto}.sidefoot{display:none}.kpis{grid-template-columns:1fr 1fr}.dashgrid{grid-template-columns:1fr}}

.rosterbar{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}.rosterrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rosterrow .chips{margin:0}
#rosterSearch{width:240px;font-size:14px}
.planchip{border:1px solid #ddd5db;background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.planchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rostercount{margin:8px 2px}
table.roster{font-size:14.5px}table.roster th{font-size:12.5px}table.roster td{padding:12px 10px}
table.roster td.nm{font-size:16px;font-weight:700;white-space:nowrap}table.roster td.nm .link{color:var(--ink);text-decoration:none}table.roster td.nm .link:hover{color:var(--wine);text-decoration:underline}

.scroll.tall{max-height:calc(100vh - 260px)}

#backToRoster{margin-bottom:10px;display:inline-block}
.memberhead .mh-name{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.memberhead .mh-facts{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:8px;color:var(--muted);font-size:13px}.memberhead .mh-facts b{color:var(--ink);font-size:15px}

.membergrid{display:grid;grid-template-columns:1.8fr 1fr;gap:12px;align-items:start}.mcol .panel{margin-bottom:12px}
#memo{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid #d8d0d6;border-radius:8px;resize:vertical}
details summary{cursor:pointer;margin-top:10px}
@media(max-width:860px){.membergrid{grid-template-columns:1fr}}

.lastcsv{font-size:12px;color:var(--muted);margin-right:6px;align-self:center}.lastcsv.warn{color:var(--warn);font-weight:700}
.plangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.plangrid .panel{margin:0}
.plancard{border-top:4px solid var(--line)}.pc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.pc-head b{font-size:18px;color:var(--ink)}.pc-head span{color:var(--muted);font-weight:700}
.plancard h4{margin:12px 0 4px;font-size:13px;color:var(--muted)}.plancard ul.plain{line-height:1.75}
.tracked{display:inline-block;font-size:10px;font-weight:700;background:#eef3fb;color:#2f5aa0;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px}
.excl{color:#8a5a00;background:#fff8e6;border-radius:8px;padding:6px 8px;margin-top:10px}.pc-tenure{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.perkplan{margin-bottom:10px}.perkrow{display:flex;gap:10px;align-items:center;margin:4px 0}.perkrow input[name=perkname]{flex:1}
.namelink{color:var(--ink);text-decoration:none;font-weight:600}.namelink:hover{color:var(--wine);text-decoration:underline}
.planrow{margin:2px 0 6px;justify-content:flex-end}

/* ---- one-click rows ---- */
#dashUrgent .item{grid-template-columns:34px 92px minmax(120px,170px) 1fr 34px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #cdbfc7;background:#fff;cursor:pointer;position:relative}
.check:hover{border-color:#7e4cc4;background:#f3ecfc}.check:hover::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#7e4cc4;font-weight:800}
.more{width:30px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;padding:0 0 6px;color:var(--muted);align-self:center}.more:hover{background:#f1ecef}
.menu{display:flex;flex-direction:column;gap:6px}.menuitem{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer}.menuitem:hover{border-color:var(--wine);background:var(--wine-soft)}
.sortsel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500;margin:0 8px 0 0}.sortsel select{padding:3px 6px;font-size:12px;width:auto;display:inline;margin:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50}
.toast{display:flex;align-items:center;gap:14px;background:#2b1d24;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 8px 30px #0004;font-size:14px}
.toast .undo{background:none;border:1px solid #fff6;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
/* ---- perk grid (統一色：紫=済 赤=期限切れ 白=今 灰=先) ---- */
.grid-row{padding:10px 0;border-bottom:1px solid #f3eff2}.gr-title{font-weight:700;margin-bottom:8px;display:flex;align-items:center}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border-radius:10px;padding:8px 10px;border:1px solid;cursor:pointer;font:inherit;text-align:left;min-height:56px}
.cell .cl{font-size:11px;color:var(--muted);font-weight:600}.cell .cs{font-size:13px;font-weight:700}
.cell.st-done{background:#efe6fb;border-color:#d8c4f3;color:#6b3fb0}.cell.st-done .cl{color:#8f6cc4}
.cell.st-overdue{background:#fdecea;border-color:#f3b4ab;color:#a8231a}
.cell.st-current{background:#fff;border:2px solid var(--wine);color:var(--wine)}
.cell.st-future{background:#f6f4f5;border-color:#ebe6e9;color:#aaa;cursor:default}
.cell.st-carried,.cell.st-dismissed{background:#f6f4f5;border-color:#e0dadd;color:#888}
.cell:hover{filter:brightness(.97)}
.legend{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}.legend .lg{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid}
.lg.st-done{background:#efe6fb;border-color:#d8c4f3}.lg.st-overdue{background:#fdecea;border-color:#f3b4ab}.lg.st-current{background:#fff;border-color:var(--wine)}.lg.st-future{background:#f6f4f5;border-color:#ebe6e9}
.older{margin-bottom:8px}.older summary{font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:6px}.older .cells{margin-bottom:6px}b.red{color:var(--warn)}
.verbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.verbtn{border:1px solid #ddd5db;background:#fff;border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.verbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.settabs{display:flex;gap:6px;margin-bottom:12px}.settab{border:1px solid #ddd5db;background:#fff;border-radius:999px;padding:6px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.settab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.more-details{padding:0}.more-details>summary{padding:14px 16px;cursor:pointer;font-weight:700;font-size:14px}.more-details[open]>summary{border-bottom:1px solid var(--line)}.more-details .sub{padding:12px 16px;border-bottom:1px solid #f3eff2}.more-details .sub:last-child{border-bottom:0}
.cell{position:relative}.cellmenu{position:absolute;top:3px;right:7px;display:none;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px;color:inherit}.cell:hover .cellmenu{display:block}.cellmenu:hover{background:#0000000f}

/* ---- dashboard: hero, quick actions, calendar ---- */
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,#8e2443,#6d1b37);color:#fff;border-radius:20px;padding:24px 28px;margin-bottom:14px;box-shadow:0 10px 30px #8e244333}
.hero-label{font-size:13px;opacity:.85;font-weight:600}.hero-num{display:flex;align-items:baseline;gap:6px;margin:4px 0 14px}.hero-num b{font-size:52px;line-height:1;letter-spacing:1px}.hero-num span{font-size:18px;font-weight:700}
.hero-num em{font-style:normal;margin-left:12px;background:#fff;color:var(--warn);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
.hero .btn.primary{background:#fff;color:var(--wine)}.hero-ring{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;opacity:.95}
.ring{width:110px;height:110px}.ring-bg{fill:none;stroke:#ffffff33;stroke-width:9}.ring-fg{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round}.ring text{fill:#fff;font-size:17px;font-weight:800}
.qas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px #2b1d240a}
.qa span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--wine-soft);color:var(--wine);font-size:20px}.qa:hover{border-color:var(--wine)}
.small-kpis{display:flex;gap:18px;margin:0 4px 12px;font-size:13px;color:var(--muted)}.small-kpis b{color:var(--ink)}
#cal .secthead h2{font-size:16px}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.day{position:relative;height:46px;border:1px solid transparent;border-radius:10px;background:#faf7f8;font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day.empty{background:none}.day.today{border-color:var(--wine);font-weight:800;color:var(--wine)}.day.sel{background:var(--ink);color:#fff}
.day i{min-width:8px;height:8px;border-radius:999px;background:#7e4cc4;font-style:normal;font-size:10px;line-height:8px;color:#fff;padding:0 3px}.day i:not(:empty){height:14px;line-height:14px;min-width:14px}.day i.red{background:var(--warn)}
#calDay{margin-top:12px}#calDay h4{margin:6px 0}
/* ---- phones: bottom bar ---- */
@media(max-width:860px){
  .shell{display:block}.mainarea{padding:14px 14px 90px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;padding:6px;flex-direction:row}
  .side .club,.sidefoot{display:none}.side nav{flex-direction:row;justify-content:space-around;width:100%;flex-wrap:nowrap}
  .nav{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;width:auto;flex:1;align-items:center}.nav .ic{font-size:18px}.nav .cnt{position:absolute;margin:0 0 0 18px}
  .nav[data-page="revenue"],.nav[data-page="records"]{display:none}
  .hero{flex-direction:column;align-items:flex-start}.hero-ring{align-self:center}.qas{grid-template-columns:repeat(4,1fr);gap:8px}.qa{padding:12px 4px;font-size:11px}.qa span{width:40px;height:40px}

}

<script>(function(){

// ---- dates.js
const pad = n => String(n).padStart(2, '0');
const fmt = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parts = s => s.split('-').map(Number);
const daysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

function toDate(s) {
  const m = String(s ?? '').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m ? fmt(Number(m[1]), Number(m[2]), Number(m[3])) : null;
}
function addMonths(d, n) {
  const [y, m, day] = parts(d);
  const t = y * 12 + (m - 1) + n, ny = Math.floor(t / 12), nm = t - ny * 12 + 1;
  return fmt(ny, nm, Math.min(day, daysIn(ny, nm)));
}
function addDays(d, n) {
  const [y, m, day] = parts(d);
  const x = new Date(Date.UTC(y, m - 1, day + n));
  return fmt(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate());
}
function daysBetween(a, b) {
  const [y1, m1, d1] = parts(a), [y2, m2, d2] = parts(b);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function diffMonthsDays(a, b) {
  let months = 0;
  while (compare(addMonths(a, months + 1), b) <= 0) months++;
  return { months, days: daysBetween(addMonths(a, months), b) };
}
const monthKey = d => d.slice(0, 7);
const compare = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
function endOfMonth(d) { const [y, m] = parts(d); return fmt(y, m, daysIn(y, m)); }
function todayLocal() { const x = new Date(); return fmt(x.getFullYear(), x.getMonth() + 1, x.getDate()); }

// ---- defaults.js
const PLAN_DEFS = [
  ['toriko', '虜プラン', 500], ['keiai', '敬愛プラン', 3000], ['suuhai', '崇拝プラン', 5000],
  ['ketsuniku', '血肉プラン', 10000], ['kyoai', '狂愛プラン', 30000],
];
const OLD_RULES_UNTIL = '2026-11-30';   // 11月までは旧の特典内容、12/1から新

function oldPlanPerks() {
  return {
    toriko: [{ name: '最新情報や先行公開（不定期）' }, { name: '気まぐれブログ（不定期）' }, { name: 'Discordサーバーご招待', rule: 'discord' }, { name: '月1FCルーレット配信（激レア特典もらえる）' }, { name: 'FC限定グッズショップ' }, { name: '限定配信（不定期）' }],
    keiai: [{ name: '日常ボイスや落書き（不定期）' }, { name: 'プチ漫画投稿（不定期）' }, { name: 'くれあと加入者全員で通話交流会（不定期）' }],
    suuhai: [{ name: '季節や行事ごとシチュエーションボイス' }, { name: 'FC限定グッズショップの300円値引き' }],
    ketsuniku: [{ name: '1on1通話券（10分・3か月に1回）', rule: 'call-ketsuniku', noInherit: true }, { name: 'ディスコ個人チャット（返信不定期）' }, { name: '鍵垢Xの公開（不定期）', rule: 'kagiaka' }, { name: 'お誕生日ビデオレター', rule: 'birthday' }],
    kyoai: [{ name: '1on1通話券（1時間・月1回）', rule: 'call-kyoai' }],
  };
}
const OLD_TENURE = { toriko: 'シンプル可愛い壁紙プレゼント', keiai: 'デジタル特典', suuhai: 'シチュエーション動画', ketsuniku: 'フィジカルグッズ', kyoai: 'フィジカルグッズ＋私物' };

function defaultPlanPerks() {
  return {
    toriko: [{ name: '最新情報＆ブログ' }, { name: 'FCサーバー招待（Discord）', rule: 'discord' }, { name: '特典ルーレット（豪華特典）' }, { name: 'ネップリ' }, { name: 'FC限定ショップ' }],
    keiai: [{ name: 'くれあの日常（日常ボイス・らくがき・好き語り）' }, { name: 'リスナーゲーム通話交流会（不定期・ミュートOK）' }, { name: '限定配信（不定期）' }, { name: 'プチ漫画（不定期）' }],
    suuhai: [{ name: '季節ごとシチュエーションボイス' }, { name: 'FC限定グッズ300円引き' }],
    ketsuniku: [{ name: '10分通話 or 名前呼びシチュボ（3か月に1回）', rule: 'call-ketsuniku', inheritAs: { name: '名前呼びシチュボ（3か月に1回）', rule: 'situvo-kyoai' }, inheritNote: '血肉の「10分通話」は1時間通話券に含まれるため、名前呼びシチュボを自動で受け取ります' }, { name: '鍵垢Xの公開', rule: 'kagiaka' }, { name: 'お誕生日ビデオレター', rule: 'birthday' }],
    kyoai: [{ name: '1時間通話券（1か月に1回）', rule: 'call-kyoai' }],
  };
}

function defaultSettings() {
  const plans = PLAN_DEFS.map(([id, name, price], order) => ({ id, name, price, order }));
  const all = plans.map(p => p.id);
  return {
    clubName: '生稚くれあファンクラブ',
    plans,
    rules: [
      { id: 'discord', kind: 'join', planIds: all, label: 'FCサーバー招待' },
      { id: 'kagiaka', kind: 'join', planIds: ['ketsuniku', 'kyoai'], label: '鍵垢X公開' },
      { id: 'call-ketsuniku', kind: 'interval', planIds: ['ketsuniku'], months: 3, label: '10分通話 or 名前呼びシチュボ', variants: ['通話', 'シチュボ'], before: { until: OLD_RULES_UNTIL, label: '1on1通話券（10分）' } },
      { id: 'call-kyoai', kind: 'interval', planIds: ['kyoai'], months: 1, label: '1時間通話券', before: { until: OLD_RULES_UNTIL, label: '1on1通話券（1時間）' } },
      { id: 'situvo-kyoai', kind: 'interval', planIds: ['kyoai'], months: 3, label: '名前呼びシチュボ（3か月に1回）', icon: '🎤', startsOn: '2026-12-01' },
      { id: 'birthday', kind: 'birthday', planIds: ['ketsuniku', 'kyoai'], label: 'お誕生日ビデオレター' },
      { id: 'tenure-12', kind: 'tenure', planIds: all, months: 12, label: '12か月継続特典',
        labelByPlan: { toriko: 'デジタル特典', keiai: 'ステッカー特典', suuhai: 'チャーム特典', ketsuniku: 'フィジカルグッズ特典', kyoai: 'フィジカルグッズ＆私物特典' },
        before: { until: OLD_RULES_UNTIL, labelByPlan: OLD_TENURE } },
    ],
    planPerks: defaultPlanPerks(),
    planPerksBefore: { until: OLD_RULES_UNTIL, perks: oldPlanPerks() },
    rulesVersion: 3,
    updatedAt: '1970-01-01T00:00:00.000Z',
  };
}
function emptyData() {
  return { version: 5, settings: defaultSettings(), fans: {}, records: {}, meta: { migratedAt: null, lastSavedBy: '', lastSavedAt: '' } };
}
const planById = (s, id) => s.plans.find(p => p.id === id);
const planByName = (s, name) => s.plans.find(p => p.name === String(name).trim());

// 以前に保存された設定を新しい既定に合わせる（1回だけ）。ユーザーが消したルールは戻さない。
function upgradeSettings(data, today, now) {
  const st = data.settings || {};
  if ((st.rulesVersion || 1) >= 3) return data;
  const next = JSON.parse(JSON.stringify(data));
  if ((st.rulesVersion || 1) < 2) upgradeTo2(next, today);
  upgradeTo3(next);
  next.settings.rulesVersion = 3;
  next.settings.updatedAt = now;
  return next;
}

function upgradeTo3(next) {
  const defs = defaultSettings().rules;
  for (const r of next.settings.rules) {
    const def = defs.find(x => x.id === r.id);
    if (def && def.before && !r.before) r.before = def.before;
    if (r.id === 'situvo-kyoai' && (!r.startsOn || r.startsOn < '2026-12-01')) r.startsOn = '2026-12-01';
  }
  if (!next.settings.planPerksBefore) next.settings.planPerksBefore = { until: OLD_RULES_UNTIL, perks: oldPlanPerks() };
}

function upgradeTo2(next, today) {
  if (!next.settings.rules.some(r => r.id === 'situvo-kyoai')) {
    const def = defaultSettings().rules.find(r => r.id === 'situvo-kyoai');
    const at = next.settings.rules.findIndex(r => r.id === 'call-kyoai');
    next.settings.rules.splice(at >= 0 ? at + 1 : next.settings.rules.length, 0, { ...def, startsOn: today });
  }
  if (next.settings.planPerks && next.settings.planPerks.ketsuniku) {
    const call = next.settings.planPerks.ketsuniku.find(x => x.rule === 'call-ketsuniku');
    const def = defaultPlanPerks().ketsuniku[0];
    if (call) { delete call.noInherit; call.inheritAs = def.inheritAs; call.inheritNote = def.inheritNote; }
  }
}

// ---- csv.js

function csvRecords(text) {
  const out = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); out.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}

const COLS = { planName: 'プラン名', name: 'ユーザー名', planJoinDate: '現在のプランの加入日', profileUrl: 'プロフィールページURL', memberNo: '会員番号' };

function parseCreatiaCsv(text) {
  const recs = csvRecords(text);
  const head = (recs.shift() || []).map(h => h.trim());
  const idx = Object.fromEntries(Object.entries(COLS).map(([k, h]) => [k, head.indexOf(h)]));
  const missing = Object.entries(idx).filter(([, i]) => i < 0).map(([k]) => COLS[k]);
  if (missing.length) return { rows: [], skipped: [{ line: 1, reason: '列が見つかりません：' + missing.join('、') }] };
  const rows = [], skipped = [];
  recs.forEach((r, n) => {
    const get = k => (r[idx[k]] || '').trim();
    const line = n + 2;
    if (!get('memberNo')) return skipped.push({ line, reason: '会員番号が空です' });
    if (!/^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}$/.test(get('planJoinDate'))) return skipped.push({ line, memberNo: get('memberNo'), reason: '加入日が読めません' });
    rows.push({ memberNo: get('memberNo'), name: get('name'), planName: get('planName'), planJoinDate: toDate(get('planJoinDate')), profileUrl: get('profileUrl') });
  });
  return { rows, skipped };
}

// ---- fans.js

const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));

function applyCsv(data, rows, today, keepMemberNos = []) {
  data = clone(data);
  const summary = { added: [], leftCandidates: [], rejoined: [], planChanged: [], skipped: [] };
  const seen = new Set(keepMemberNos), done = new Set();
  for (const r of rows) {
    const plan = planByName(data.settings, r.planName);
    if (!plan) { seen.add(r.memberNo); summary.skipped.push({ memberNo: r.memberNo, reason: '不明なプラン：' + r.planName }); continue; }
    if (done.has(r.memberNo)) { summary.skipped.push({ memberNo: r.memberNo, reason: '会員番号が重複しています' }); continue; }
    seen.add(r.memberNo); done.add(r.memberNo);
    let f = data.fans[r.memberNo];
    if (!f) {
      data.fans[r.memberNo] = { memberNo: r.memberNo, name: r.name, profileUrl: r.profileUrl, birthday: null, status: 'active',
        periods: [{ start: r.planJoinDate, end: null }], planHistory: [{ planId: plan.id, start: r.planJoinDate, end: null }], updatedAt: nowIso() };
      summary.added.push(r.memberNo); continue;
    }
    let touched = false;
    if (f.name !== r.name || f.profileUrl !== r.profileUrl) { f.name = r.name; f.profileUrl = r.profileUrl; touched = true; }
    if (f.status === 'left') {
      f.periods.push({ start: r.planJoinDate, end: null });
      f.planHistory.push({ planId: plan.id, start: r.planJoinDate, end: null });
      f.status = 'active'; summary.rejoined.push(r.memberNo); touched = true;
    } else {
      if (f.status === 'leftCandidate') { f.status = 'active'; touched = true; }
      const open = f.planHistory.find(h => h.end === null);
      if (open && open.planId !== plan.id) {
        open.end = addDays(r.planJoinDate, -1);
        f.planHistory.push({ planId: plan.id, start: r.planJoinDate, end: null });
        summary.planChanged.push(r.memberNo); touched = true;
      }
    }
    if (touched) f.updatedAt = nowIso();
  }
  for (const f of Object.values(data.fans)) {
    if (f.status === 'active' && !seen.has(f.memberNo)) {
      f.status = 'leftCandidate'; f.updatedAt = nowIso(); summary.leftCandidates.push(f.memberNo);
    }
  }
  return { data, summary };
}

function confirmLeft(data, memberNo, date) {
  data = clone(data);
  const f = data.fans[memberNo];
  f.status = 'left';
  f.periods.forEach(p => { if (p.end === null) p.end = date; });
  f.planHistory.forEach(h => { if (h.end === null) h.end = date; });
  f.updatedAt = nowIso();
  return data;
}

// ---- tenure.js

function reachDate(fan, months) {
  let accM = 0, accD = 0;
  for (const p of fan.periods) {
    const cand = addDays(addMonths(p.start, months - accM), -accD);
    if (p.end === null || compare(cand, p.end) <= 0) return cand;
    const d = diffMonthsDays(p.start, p.end);
    accM += d.months; accD += d.days;
  }
  return null;
}

function planOn(fan, date) {
  const h = fan.planHistory.find(h => compare(h.start, date) <= 0 && (h.end === null || compare(date, h.end) <= 0));
  return h ? h.planId : null;
}

// ---- obligations.js

// 旧（〜11/30）か新（12/1〜）か：今日の日付で決める
const isOld = (rule, today) => !!(rule && rule.before && compare(today, rule.before.until) <= 0);
function tenureLabel(rule, planId, today) {
  const labels = isOld(rule, today) ? rule.before.labelByPlan : rule.labelByPlan;
  return (labels && labels[planId]) || rule.label;
}
const ruleVariants = (rule, today) => (!rule || isOld(rule, today) ? [] : rule.variants || []);

function eligibleRuns(fan, planIds) {
  const runs = [];
  for (const h of fan.planHistory) {
    if (!planIds.includes(h.planId)) continue;
    const last = runs.at(-1);
    if (last && last.end && addDays(last.end, 1) === h.start) last.end = h.end;
    else runs.push({ start: h.start, end: h.end });
  }
  return runs;
}

function intervalTickets(fan, rule, horizon) {
  const out = [];
  for (const run of eligibleRuns(fan, rule.planIds)) {
    for (let k = 0; ; k++) {
      const ps = addMonths(run.start, k * rule.months);
      if (compare(ps, horizon) > 0 || (run.end && compare(ps, run.end) > 0)) break;
      out.push({ key: `${rule.id}|${fan.memberNo}|${ps}`, periodStart: ps, due: addDays(addMonths(run.start, (k + 1) * rule.months), -1) });
    }
  }
  return out;
}

const birthdayOn = (year, mmdd) => {
  const [m, d] = mmdd.split('-').map(Number);
  const leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  return `${year}-${String(m).padStart(2, '0')}-${String(m === 2 && d === 29 && !leap ? 28 : d).padStart(2, '0')}`;
};

function generate(data, today) {
  const items = [];
  const horizon = addMonths(today, 13);
  for (const fan of Object.values(data.fans)) {
    const base = { fanId: fan.memberNo, fanLeft: fan.status === 'left', count: 1, coversKeys: [], scheduled: false };
    for (const rule of data.settings.rules) {
      const push = (key, due, title) => items.push({ ...base, key, ruleId: rule.id, kind: rule.kind, title, due });
      if (rule.kind === 'join') {
        for (const run of eligibleRuns(fan, rule.planIds)) push(`${rule.id}|${fan.memberNo}|${run.start}`, run.start, rule.label);
      } else if (rule.kind === 'interval') {
        for (const t of intervalTickets(fan, rule, horizon)) if (!rule.startsOn || compare(t.due, rule.startsOn) >= 0) items.push({ ...base, key: t.key, ruleId: rule.id, kind: rule.kind, title: isOld(rule, today) ? rule.before.label : rule.label, due: t.due, periodStart: t.periodStart });
      } else if (rule.kind === 'birthday') {
        if (!fan.birthday) continue;
        for (const run of eligibleRuns(fan, rule.planIds)) {
          for (let y = Number(run.start.slice(0, 4)); y <= Number(today.slice(0, 4)) + 1; y++) {
            const d = birthdayOn(y, fan.birthday);
            if (fan.birthdaySetOn && compare(d, fan.birthdaySetOn) < 0) continue;
            if (compare(d, run.start) >= 0 && (!run.end || compare(d, run.end) <= 0)) push(`${rule.id}|${fan.memberNo}|${y}`, d, rule.label);
          }
        }
      } else if (rule.kind === 'tenure') {
        const due = reachDate(fan, rule.months);
        if (!due) continue;
        const plan = planOn(fan, due);
        if (!plan || !rule.planIds.includes(plan)) continue;
        const label = tenureLabel(rule, plan, today);
        push(`${rule.id}|${fan.memberNo}|${rule.months}`, due, label.includes(`${rule.months}か月`) ? label : `${rule.months}か月継続：${label}`);
      }
    }
  }
  return items;
}

const live = data => Object.values(data.records).filter(r => !r.deleted);
const latest = (rs) => rs.sort((a, b) => compare(a.updatedAt, b.updatedAt)).at(-1);

function computeList(data, today, opts = {}) {
  const recs = live(data);
  const settled = new Set();
  for (const r of recs) {
    if (r.type === 'delivered' || r.type === 'dismissed' || r.type === 'migrated') settled.add(r.key);
    if (r.type === 'delivered') (r.coversKeys || []).forEach(k => settled.add(k));
  }
  const byKey = new Map(), carries = new Map(), schedules = new Map();
  for (const r of recs) {
    if (r.type === 'carry') carries.set(r.key, latest([...(carries.has(r.key) ? [carries.get(r.key)] : []), r]));
    if (r.type === 'schedule') schedules.set(r.key, latest([...(schedules.has(r.key) ? [schedules.get(r.key)] : []), r]));
  }
  const extras = recs.filter(r => r.type === 'extra' && data.fans[r.fanId]).map(r => ({
    key: r.key, fanId: r.fanId, ruleId: 'extra', kind: 'extra', title: r.title, due: r.due, extraId: r.id,
    fanLeft: data.fans[r.fanId].status === 'left', count: 1, coversKeys: [], scheduled: false }));
  let items = [...generate(data, today), ...extras].filter(i => !settled.has(i.key));
  items.forEach(i => byKey.set(i.key, i));
  for (const i of items) {
    const s = schedules.get(i.key);
    if (s && s.scheduledDate) { i.due = s.scheduledDate; i.scheduled = true; }
  }
  items.sort((a, b) => compare(a.periodStart || a.due, b.periodStart || b.due));
  const hidden = new Set();
  for (const i of items) {
    const c = carries.get(i.key);
    if (!c) continue;
    const target = byKey.get(c.carryTo);
    if (!target) continue;
    target.count += i.count;
    target.coversKeys.push(i.key, ...i.coversKeys);
    hidden.add(i.key);
  }
  const limit = endOfMonth(addMonths(today, 1));
  const until = opts.untilMonths ? addMonths(today, opts.untilMonths) : null;
  const order = { overdue: 0, thisMonth: 1, nextMonth: 2, later: 3 };
  items = items.filter(i => !hidden.has(i.key) && (!opts.fanId || i.fanId === opts.fanId)
    && (compare(i.due, limit) <= 0 || i.kind === 'extra' || (until && compare(i.due, until) <= 0))).map(i => {
    const status = compare(i.due, today) < 0 ? 'overdue' : monthKey(i.due) === monthKey(today) ? 'thisMonth' : compare(i.due, limit) <= 0 ? 'nextMonth' : 'later';
    const { periodStart, ...rest } = i;
    return { ...rest, status };
  }).sort((a, b) => order[a.status] - order[b.status] || compare(a.due, b.due) || compare(a.fanId, b.fanId));

  const active = Object.values(data.fans).filter(f => f.status !== 'left');
  const bdRules = data.settings.rules.filter(r => r.kind === 'birthday');
  const missingBirthday = active.filter(f => !f.birthday && bdRules.some(r => r.planIds.includes(planOn(f, today)))).map(f => f.memberNo);
  const decided = new Set(data.settings.rules.filter(r => r.kind === 'tenure').map(r => r.months));
  const soon = addMonths(today, 1);
  const undecidedMilestones = [24, 36].filter(m => !decided.has(m)).map(months => ({
    months, memberNos: active.filter(f => { const d = reachDate(f, months); return d && compare(d, soon) <= 0; }).map(f => f.memberNo),
  })).filter(x => x.memberNos.length);
  return { items, notices: { missingBirthday, undecidedMilestones } };
}

function nextIntervalKey(data, key) {
  const [ruleId, fanId, ps] = key.split('|');
  const rule = data.settings.rules.find(r => r.id === ruleId), fan = data.fans[fanId];
  if (!rule || !fan) return null;
  const ts = intervalTickets(fan, rule, addMonths(ps, rule.months * 2));
  const i = ts.findIndex(t => t.periodStart === ps);
  return i >= 0 && ts[i + 1] ? ts[i + 1].key : null;
}

function intervalTicketsFor(fan, rule, horizon) { return intervalTickets(fan, rule, horizon); }

const ISO_DAY = /^\d{4}-\d{2}-\d{2}$/;
function invalidDateFans(data) {
  const ok = d => d === null || ISO_DAY.test(d);
  return Object.values(data.fans).filter(f => !f.periods.every(p => ISO_DAY.test(p.start) && ok(p.end)) || !f.planHistory.every(h => ISO_DAY.test(h.start) && ok(h.end))).map(f => f.memberNo);
}

// 個人ページのマス目：その人が対象になった特典を、期間ごとにすべて並べる
const GRID_ORDER = ['interval', 'tenure', 'birthday', 'join', 'extra'];
function fanPerkGrid(data, fanId, today) {
  const fan = data.fans[fanId];
  if (!fan) return [];
  const recs = live(data).filter(r => r.fanId === fanId);
  const settledBy = new Map();   // key -> [{id, date, type}]
  const add = (k, r) => { if (!settledBy.has(k)) settledBy.set(k, []); settledBy.get(k).push(r); };
  for (const r of recs) {
    if (r.type === 'delivered' || r.type === 'dismissed' || r.type === 'migrated') add(r.key, r);
    if (r.type === 'delivered') (r.coversKeys || []).forEach(k => add(k, r));
  }
  const carries = new Map(recs.filter(r => r.type === 'carry').map(r => [r.key, r]));
  const schedules = new Map();
  for (const r of recs.filter(r => r.type === 'schedule')) { const p = schedules.get(r.key); if (!p || p.updatedAt < r.updatedAt) schedules.set(r.key, r); }
  const limit = endOfMonth(addMonths(today, 1));
  const items = generate(data, today).filter(i => i.fanId === fanId);
  const extras = recs.filter(r => r.type === 'extra').map(r => ({ key: r.key, ruleId: 'extra', kind: 'extra', title: r.title, due: r.due, fanId }));
  const rows = new Map();
  for (const i of [...items, ...extras]) {
    const rowKey = i.kind === 'tenure' ? 'tenure' : i.ruleId;
    if (!rows.has(rowKey)) {
      const rule = data.settings.rules.find(r => r.id === i.ruleId);
      rows.set(rowKey, { ruleId: i.kind === 'tenure' ? 'tenure' : i.ruleId, kind: i.kind, title: i.kind === 'extra' ? '個別の特典' : i.kind === 'tenure' ? '継続特典' : rule.label, months: rule && rule.months, icon: rule && rule.icon, cells: [] });
    }
    rows.get(rowKey).cells.push(i);
  }
  const out = [];
  for (const row of rows.values()) {
    let cells = row.cells.sort((a, b) => (row.kind === 'tenure' ? Number(a.key.split('|')[2]) - Number(b.key.split('|')[2]) : compare(a.periodStart || a.due, b.periodStart || b.due)));
    if (row.kind === 'interval') {
      const firstFuture = cells.findIndex(c => compare(c.periodStart, today) > 0);
      if (firstFuture >= 0) cells = cells.slice(0, firstFuture + 1);
    }
    const counts = {};
    row.cells = cells.map(c => {
      const s = schedules.get(c.key);
      const due = s && s.scheduledDate ? s.scheduledDate : c.due;
      const by = settledBy.get(c.key) || [];
      const label = row.kind === 'interval' ? (row.months === 1 ? c.periodStart.slice(0, 7) : c.periodStart.slice(0, 7) + '〜')
        : row.kind === 'tenure' ? c.key.split('|')[2] + 'か月' : row.kind === 'birthday' ? c.key.split('|')[2]
        : row.kind === 'extra' ? c.title : c.title;
      let state;
      if (by.some(r => r.type !== 'dismissed')) state = 'done';
      else if (by.length) state = 'dismissed';
      else if (carries.has(c.key)) state = 'carried';
      else if (compare(due, today) < 0) state = 'overdue';
      else if (row.kind === 'interval' ? compare(c.periodStart, today) <= 0 : compare(due, limit) <= 0) state = 'current';
      else state = 'future';
      const count = 1 + (counts[c.key] || 0);
      const carry = carries.get(c.key);
      if (carry && carry.carryTo) counts[carry.carryTo] = count;
      const doneRec = by.find(r => r.type === 'delivered') || by[0];
      return { key: c.key, label, due, periodStart: c.periodStart || null, state, count, scheduled: !!(s && s.scheduledDate),
        recordIds: by.map(r => r.id), doneDate: doneRec ? doneRec.date || null : null, title: c.title };
    });
    out.push(row);
  }
  return out.sort((a, b) => GRID_ORDER.indexOf(a.kind) - GRID_ORDER.indexOf(b.kind));
}

// 今月が期限の特典のうち、何件渡したか（ダッシュボードの輪）
function monthProgress(data, today) {
  const recs = live(data);
  const settled = new Set();
  for (const r of recs) {
    if (r.type === 'delivered' || r.type === 'dismissed' || r.type === 'migrated') settled.add(r.key);
    if (r.type === 'delivered') (r.coversKeys || []).forEach(k => settled.add(k));
  }
  const carried = new Set(recs.filter(r => r.type === 'carry').map(r => r.key));
  const sched = new Map();
  for (const r of recs.filter(r => r.type === 'schedule')) { const p = sched.get(r.key); if (!p || p.updatedAt < r.updatedAt) sched.set(r.key, r); }
  const extras = recs.filter(r => r.type === 'extra' && data.fans[r.fanId]).map(r => ({ key: r.key, due: r.due }));
  const mk = monthKey(today);
  const inMonth = [...generate(data, today), ...extras]
    .map(i => ({ key: i.key, due: (sched.get(i.key) || {}).scheduledDate || i.due }))
    .filter(i => !carried.has(i.key) && monthKey(i.due) === mk);
  return { total: inMonth.length, done: inMonth.filter(i => settled.has(i.key)).length };
}

// ---- records.js

const copyData = d => JSON.parse(JSON.stringify(d));
const newId = device => `${device}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

function addRecord(data, fields, ctx) {
  data = copyData(data);
  let id = newId(ctx.device);
  while (data.records[id]) id = newId(ctx.device);
  data.records[id] = { id, ...fields, device: ctx.device, updatedAt: ctx.now, deleted: false };
  return data;
}

const deliver = (data, item, { date, memo = '', variant = '', minutes = null }, ctx) =>
  addRecord(data, { key: item.key, fanId: item.fanId, title: item.title || '', type: 'delivered', date, memo, variant, minutes, coversKeys: [...(item.coversKeys || [])] }, ctx);

const dismiss = (data, item, memo, ctx) =>
  addRecord(data, { key: item.key, fanId: item.fanId, title: item.title || '', type: 'dismissed', memo: memo || '' }, ctx);

const schedule = (data, key, fanId, scheduledDate, ctx) =>
  addRecord(data, { key, fanId, type: 'schedule', scheduledDate }, ctx);

const carry = (data, key, fanId, ctx) =>
  addRecord(data, { key, fanId, type: 'carry', carryTo: nextIntervalKey(data, key) }, ctx);

function removeRecord(data, recordId, ctx) {
  data = copyData(data);
  Object.assign(data.records[recordId], { deleted: true, updatedAt: ctx.now, device: ctx.device });
  return data;
}

function editRecord(data, recordId, patch, ctx) {
  data = copyData(data);
  Object.assign(data.records[recordId], patch, { updatedAt: ctx.now, device: ctx.device });
  return data;
}

function addExtra(data, fanIds, { title, due }, ctx) {
  data = copyData(data);
  for (const fanId of fanIds) {
    let id = newId(ctx.device);
    while (data.records[id]) id = newId(ctx.device);
    data.records[id] = { id, key: `extra|${fanId}|${id}`, fanId, type: 'extra', title, due, device: ctx.device, updatedAt: ctx.now, deleted: false };
  }
  return data;
}

const addCsvLog = (data, counts, ctx) =>
  addRecord(data, { key: 'csvlog', type: 'csvlog', at: ctx.now, counts }, ctx);

function latestCsvLog(data) {
  const logs = Object.values(data.records).filter(r => r.type === 'csvlog' && !r.deleted).sort((a, b) => (a.at < b.at ? 1 : -1));
  return logs[0] || null;
}

// ---- merge.js
const deep = o => JSON.parse(JSON.stringify(o));
function newer(x, y) {
  if (!x) return y; if (!y) return x;
  const a = x.updatedAt || '', b = y.updatedAt || '';
  if (a !== b) return a > b ? x : y;
  return JSON.stringify(x) >= JSON.stringify(y) ? x : y;
}
function mergeMap(a = {}, b = {}) {
  const out = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) out[k] = newer(a[k], b[k]);
  return out;
}
function mergeFans(a = {}, b = {}) {
  const out = mergeMap(a, b);
  for (const k of Object.keys(out)) {
    const x = a[k], y = b[k];
    if (!x || !y) continue;
    const bx = x.birthdayUpdatedAt || '', by = y.birthdayUpdatedAt || '';
    if (bx !== by) {
      const src = bx > by ? x : y;
      out[k] = { ...out[k], birthday: src.birthday, birthdayUpdatedAt: src.birthdayUpdatedAt, birthdaySetOn: src.birthdaySetOn || out[k].birthdaySetOn };
    }
    const mx = x.memoUpdatedAt || '', my = y.memoUpdatedAt || '';
    if (mx !== my) { const src = mx > my ? x : y; out[k] = { ...out[k], memo: src.memo, memoUpdatedAt: src.memoUpdatedAt }; }
  }
  return out;
}
function mergeData(a, b) {
  if (!a) return deep(b); if (!b) return deep(a);
  const ma = a.meta || {}, mb = b.meta || {};
  const mig = [ma.migratedAt, mb.migratedAt].filter(Boolean).sort()[0] || null;
  const saver = (ma.lastSavedAt || '') >= (mb.lastSavedAt || '') ? ma : mb;
  return deep({
    version: 5,
    settings: newer(a.settings, b.settings),
    fans: mergeFans(a.fans, b.fans),
    records: mergeMap(a.records, b.records),
    meta: { migratedAt: mig, lastSavedBy: saver.lastSavedBy || '', lastSavedAt: saver.lastSavedAt || '' },
  });
}

// ---- migrate-v4.js

function migrateV4(v4, today, ctx) {
  if (!v4 || !v4.config || !v4.state || typeof v4.state.fans !== 'object') throw new Error('v4の書き出しファイルではありません');
  const settings = defaultSettings();
  if (v4.config.clubName) settings.clubName = v4.config.clubName;
  settings.updatedAt = ctx.now;
  const v4Plans = v4.config.plans || [];
  const toPlanId = raw => {
    const s = String(raw || '');
    const name = (v4Plans.find(p => p.id === s) || {}).name || s;
    const p = planByName(settings, name) || settings.plans.find(p => name.includes(p.name.replace(/プラン$/, '')));
    return p ? p.id : null;
  };
  const data = { version: 5, settings, fans: {}, records: {}, meta: { migratedAt: today, lastSavedBy: ctx.device, lastSavedAt: ctx.now } };
  let seq = 0;
  const add = r => { const id = `${ctx.device}-v4-${(seq++).toString(36)}`; data.records[id] = { id, src: 'v4', device: ctx.device, updatedAt: ctx.now, deleted: false, memo: '', ...r }; };

  const droppedFans = [];
  for (const f of Object.values(v4.state.fans)) {
    const id = String(f.id);
    const start = toDate(f.continuityStartDate) || toDate(f.join) || toDate(f.planJoinDate);
    const status = f.status === 'left' ? 'left' : f.status === 'candidate' ? 'leftCandidate' : 'active';
    const endAt = status === 'left' ? (toDate(f.leftDate) || today) : null;
    let hist = (Array.isArray(f.planHistory) && f.planHistory.length ? f.planHistory : [{ plan: f.plan, start: toDate(f.planJoinDate) || start, end: null }])
      .map(h => ({ planId: toPlanId(h.plan), start: toDate(h.start) || start, end: toDate(h.end) })).filter(h => h.planId && h.start);
    if (!hist.length) { droppedFans.push(f.name || id); continue; }
    if (start && start < hist[0].start) hist[0].start = start;
    if (endAt) hist.forEach(h => { if (h.end === null) h.end = endAt; });
    data.fans[id] = { memberNo: id, name: f.name || '', profileUrl: f.url || '', birthday: null, status,
      periods: [{ start: hist[0].start, end: endAt }], planHistory: hist, updatedAt: ctx.now };
  }

  for (const h of v4.state.history || []) {
    const id = String(h.id);
    if (!data.fans[id]) continue;
    add({ key: `tenure-${Number(h.months)}|${id}|${Number(h.months)}`, fanId: id, type: 'delivered', date: toDate(h.given) || toDate(h.target) || today, memo: [h.text, h.memo].filter(Boolean).join(' / ') || '' });
  }
  const usedTickets = new Set();
  for (const c of [...(v4.state.callHistory || [])].map(c => ({ ...c, date: toDate(c.date) })).filter(c => c.date).sort((a, b) => compare(a.date, b.date))) {
    const fan = data.fans[String(c.id)];
    if (!fan) continue;
    const plan = planOn(fan, c.date);
    const rule = settings.rules.find(r => r.kind === 'interval' && r.planIds.includes(plan));
    if (!rule) continue;
    // 期間内の通話はその期間の券。期間が始まって14日以内で、前の券が未使用なら「遅れた前回分」とみなす
    const ts = intervalTicketsFor(fan, rule, c.date).filter(t => compare(t.periodStart, c.date) <= 0);
    let t = ts.at(-1), prev = ts.at(-2);
    if (t && prev && !usedTickets.has(prev.key) && compare(c.date, addDays(t.periodStart, 14)) < 0) t = prev;
    if (!t || usedTickets.has(t.key)) continue;
    usedTickets.add(t.key);
    add({ key: t.key, fanId: fan.memberNo, type: 'delivered', date: c.date, minutes: Number(c.minutes) || null, memo: c.memo || '' });
  }
  let droppedPerkChecks = 0;
  const benefitName = (planKey, bid) => ((v4.state.planBenefits || {})[planKey] || []).find(b => b.id === bid);
  for (const [fid, recs] of Object.entries(v4.state.perkRecords || {})) {
    for (const [k, v] of Object.entries(recs || {})) {
      if (!v || !v.given || !data.fans[fid]) continue;
      const [pk, bid] = k.split('::');
      const name = (benefitName(pk, bid) || {}).name || '';
      const ruleId = /discord|サーバー/i.test(name) ? 'discord' : /鍵垢/.test(name) ? 'kagiaka' : null;
      if (!ruleId) { droppedPerkChecks++; continue; }
      const rule = settings.rules.find(r => r.id === ruleId);
      const run = data.fans[fid].planHistory.find(h => rule.planIds.includes(h.planId));
      if (run) add({ key: `${ruleId}|${fid}|${run.start}`, fanId: fid, type: 'delivered', date: toDate(v.date) || today });
    }
  }
  // 引き継いだ人の、移行日より前に期限が来ていた入会時・通話・誕生日は「引継ぎ済み」にする（1件ずつ戻せる）
  const settledKeys = new Set(Object.values(data.records).flatMap(r => [r.key, ...(r.coversKeys || [])]));
  for (const it of generate(data, today)) {
    if (it.kind === 'tenure' || compare(it.due, today) >= 0 || settledKeys.has(it.key)) continue;
    settledKeys.add(it.key);
    add({ key: it.key, fanId: it.fanId, title: it.title, type: 'migrated', memo: 'v4から引継ぎ（渡し済み扱い）' });
  }
  return { data, report: { droppedFans, fans: Object.keys(data.fans).length, records: Object.keys(data.records).length, droppedPerkChecks, droppedSchedules: (v4.state.callSchedules || []).length } };
}

// v4の読み込みをやり直すとき：ファンは新しい内容で上書きし、前回の読み込みで作られた記録のうち今回ないものは取り消す。
// v5で付けた記録（渡した・予定・次に回す など）はそのまま残す。
function mergeV4Import(current, migrated, now) {
  if (!current) return migrated;
  const fresh = JSON.parse(JSON.stringify(migrated));
  const isV4 = r => r.src === 'v4' || /-v4-[0-9a-z]+$/.test(r.id);
  // ユーザーが「未渡しに戻す」などで消した引継ぎ記録の key は、もう一度引き継がない
  const reopened = new Set(Object.values(current.records).filter(r => isV4(r) && r.deleted).map(r => r.key));
  for (const [id, r] of Object.entries(fresh.records)) {
    if (reopened.has(r.key) || (current.records[id] && current.records[id].deleted)) delete fresh.records[id];
  }
  // ファンは、今のデータで日付が読めない人・いない人だけ v4 の内容で直す（v5でのCSV取込などの変更は残す）
  const bad = new Set(invalidDateFans(current));
  for (const [no, f] of Object.entries(fresh.fans)) {
    if (current.fans[no] && !bad.has(no)) delete fresh.fans[no];
    else f.updatedAt = now;
  }
  const m = mergeData(current, fresh);
  const freshKeys = new Set(Object.values(fresh.records).map(r => r.key));
  for (const r of Object.values(m.records)) {
    if (isV4(r) && !r.deleted && !fresh.records[r.id] && !freshKeys.has(r.key) && !reopened.has(r.key)) Object.assign(r, { deleted: true, updatedAt: now });
  }
  return m;
}

// ---- storage.js

const DATA_FILE = 'fan_data.json';
const BACKUP_DIR = 'fan_data_backups';
const CONFLICT_RE = /^fan_data[- ].+\.json$/;
const KEEP = 5;
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };
const UNREADABLE = 'データファイルを読み込めません（OneDriveの同期中かもしれません）。少し待ってからもう一度開いてください。';
const withSaver = (data, device) => ({ ...data, meta: { ...(data.meta || {}), lastSavedBy: device, lastSavedAt: new Date().toISOString() } });

function createMemoryStorage({ disk = { file: null, conflicts: [], backups: [] }, deviceName = 'PC-TEST' } = {}) {
  let mtime = 0, seq = 0;
  const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
  async function readMerged() {
    if (disk.corrupt) throw new Error(UNREADABLE);
    let d = clone(disk.file);
    const ok = disk.conflicts.filter(c => !c.corrupt);
    if (ok.length) {
      if (d) disk.backups.push({ name: `before-conflict-${seq++}`, tag: 'conflict', data: clone(d) });
      for (const c of ok) d = mergeData(d, c.data);
      for (const c of ok) disk.conflicts.splice(disk.conflicts.indexOf(c), 1);
      disk.file = clone(d); mtime = Date.now() + (++seq);
    }
    return d;
  }
  return {
    init: async () => {}, status: () => 'ready', pick: async () => {}, regrant: async () => {},
    deviceName: () => deviceName, setDeviceName: n => { deviceName = n; },
    load: readMerged,
    async save(data) {
      const merged = withSaver(mergeData(await readMerged(), data), deviceName);
      disk.file = clone(merged); mtime = Date.now() + (++seq);
      return clone(merged);
    },
    async backup(data, tag) {
      disk.backups.push({ name: `fan_data_${stamp()}_${seq++}_${tag}.json`, tag, data: clone(data) });
      const mine = disk.backups.filter(b => b.tag === tag);
      while (mine.length > KEEP) disk.backups.splice(disk.backups.indexOf(mine.shift()), 1);
    },
    lastModified: async () => mtime,
  };
}

const API = 'https://www.googleapis.com/drive/v3/files';

const KEEP_BACKUPS = 5;
const MSG = {
  offline: 'Googleドライブにつながりませんでした。ネットにつながってからもう一度試してください（今の操作は保存されていません）。',
  notFound: 'データファイルが見つかりません。ゴミ箱に移されたか、共有が外れた可能性があります。',
  forbidden: 'このアカウントにはデータファイルを編集する権限がありません。メインのアカウントから「編集可能」で共有してもらってください。',
  broken: 'データファイルを読み込めません（中身が壊れている可能性があります）。',

const q = s => s.replace(/'/g, "\\'");

function createDriveStorage({ fetchFn, auth, picker, local, deviceName }) {
  let state = 'needsLogin', fileId = local.get(FILE_KEY) || null, warns = [];
  let device = deviceName || local.get(DEV_KEY) || '';
  if (!device) { device = 'PC-' + Math.random().toString(36).slice(2, 6).toUpperCase(); local.set(DEV_KEY, device); }

  async function call(url, opts = {}, retried = false) {
    const token = await auth.getToken();
    let res;
    try { res = await fetchFn(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } }); }
    catch (e) { throw new Error(MSG.offline); }
    if (res.status === 401 && !retried) { await auth.refresh(); return call(url, opts, true); }
    if (res.status === 404) throw new Error(MSG.notFound);
    if (res.status === 403) throw new Error(MSG.forbidden);
    if (!res.ok) throw new Error(`Googleドライブでエラーが起きました（${res.status}）。少し待ってからもう一度試してください。`);
    return res;
  }
  const getJson = async (url, opts) => (await call(url, opts)).json();
  const list = async query => (await getJson(`${API}?q=${encodeURIComponent(query)}&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime)`)).files || [];
  async function create(name, mimeType, parents) {
    return getJson(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, mimeType, ...(parents ? { parents } : {}) }) });
  }
  const upload = (id, obj) => call(`${UPLOAD}/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
  async function folderId(name) {
    const found = await list(`name='${q(name)}' and mimeType='${DRIVE_FOLDER}' and 'me' in owners and trashed=false`);
    return found.length ? found[0].id : (await create(name, DRIVE_FOLDER)).id;
  }
  async function readRemote() {
    const text = await (await call(`${API}/${fileId}?alt=media`)).text();
    if (!text) return null;
    let d;
    try { d = JSON.parse(text); } catch (e) { throw new Error(MSG.broken); }
    if (!d || d.version !== 5 || !d.settings || !d.fans || !d.records) throw new Error('選ばれたファイルはこのツールのデータではありません。「ファイルを選び直す」で fan_data.json を選んでください。');

  function remember(id) { fileId = id; local.set(FILE_KEY, id); state = 'ready'; }

// ---- google.js
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const TOKEN_KEY = 'fcm-v5-token';
const scripts = {};
function loadScript(src) {
  if (!scripts[src]) scripts[src] = new Promise((ok, ng) => {
    const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok;
    s.onerror = () => { delete scripts[src]; ng(new Error('Googleの部品を読み込めませんでした。ネットにつながっているか確認してください。')); };
    document.head.appendChild(s);
  });
  return scripts[src];
}

function browserLocal() {
  return { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
}

function createGoogleAuth(clientId) {
  const local = browserLocal();
  let client = null, token = null, exp = 0, pending = null;
  try { const t = JSON.parse(local.get(TOKEN_KEY) || 'null'); if (t && t.exp > Date.now()) { token = t.token; exp = t.exp; } } catch (e) {}
  async function ensure() {
    await loadScript('https://accounts.google.com/gsi/client');
    if (!client) client = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId, scope: SCOPE,
      callback: r => {
        const p = pending; pending = null; if (!p) return;
        if (r.error) return p.ng(new Error('Googleのログインができませんでした：' + r.error));
        token = r.access_token; exp = Date.now() + (Number(r.expires_in || 3600) - 120) * 1000;
        local.set(TOKEN_KEY, JSON.stringify({ token, exp })); local.set('fcm-v5-signed', '1');
        p.ok(token);
      },
      error_callback: e => {
        const p = pending; pending = null; if (!p) return;
        p.ng(new Error(e && e.type === 'popup_closed' ? 'ログイン画面が閉じられました' : 'Googleのログイン画面を開けませんでした（ポップアップがブロックされていないか確認してください）'));
      },
    });
  }
  async function request(prompt) {
    if (pending) return pending.promise;      // 同時に何度呼ばれても、ログイン画面は1つだけ
    await ensure();
    if (pending) return pending.promise;
    let ok, ng; const promise = new Promise((a, b) => { ok = a; ng = b; });
    pending = { ok, ng, promise };
    client.requestAccessToken({ prompt });
    return promise;
  }
  return {
    signedIn: () => !!token && Date.now() < exp,
    async restore() { return !!token && Date.now() < exp; },
    async login() { await request(local.get('fcm-v5-signed') === '1' ? '' : 'consent'); },
    async getToken() { return token && Date.now() < exp ? token : request(''); },
    async refresh() { token = null; return request(''); },
  };
}

function createGooglePicker(apiKey, appId) {
  return {
    async pickJson(token) {
      await loadScript('https://apis.google.com/js/api.js');
      await new Promise(r => window.gapi.load('picker', r));
      const P = window.google.picker;
      return new Promise(ok => {
        const view = new P.DocsView(P.ViewId.DOCS).setMimeTypes('application/json').setOwnedByMe(false).setIncludeFolders(false);
        new P.PickerBuilder().setOAuthToken(token).setDeveloperKey(apiKey).setAppId(appId).addView(view).setLocale('ja')
          .setTitle('共有された fan_data.json を選んでください')
          .setCallback(d => { if (d.action === P.Action.PICKED) ok(d.docs[0].id); else if (d.action === P.Action.CANCEL) ok(null); })
          .build().setVisible(true);
      });
    },
  };
}

};
const KIND_ORDER = Object.keys(KIND_META);
const STATUS_ORDER = { overdue: 0, thisMonth: 1, nextMonth: 2, later: 3 };
const cmpStr = (a, b) => String(a).localeCompare(String(b), 'ja');

function sortItems(items, mode, nameOf) {
  const tie = (a, b) => cmpStr(a.due, b.due) || cmpStr(nameOf(a.fanId), nameOf(b.fanId));
  const by = {
    due: tie,
    name: (a, b) => cmpStr(nameOf(a.fanId), nameOf(b.fanId)) || cmpStr(a.due, b.due),
    kind: (a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || cmpStr(a.title || '', b.title || '') || tie(a, b),
  }[mode] || tie;
  return [...items].sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || by(a, b));
}

const filterItems = (items, kind) => (kind && kind !== 'all' ? items.filter(i => i.kind === kind) : items);

function sortFanRows(rows, key, dir) {
  const sign = dir === 'desc' ? -1 : 1;
  const val = r => (key === 'memberNo' ? Number(r.memberNo) : r[key]);
  return [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    const bx = x === null || x === undefined || x === '', by = y === null || y === undefined || y === '';
    if (bx || by) return bx === by ? 0 : bx ? 1 : -1;            // blanks always last
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : cmpStr(x, y);
    return c * sign || Number(a.memberNo) - Number(b.memberNo);
  });
}

// カレンダー用：その月の項目を日ごとにまとめる（キーは日の数字）
function itemsByDay(items, ym) {
  const out = {};
  for (const i of items) if (i.due && i.due.slice(0, 7) === ym) (out[String(Number(i.due.slice(8, 10)))] ||= []).push(i);
  return out;
}

// ---- plan-perks.js

// そのプランが受けられる特典：自分のプランの特典＋下位プランの特典（上位に引き継がないものは除く）
function perksForPlan(settings, planId, date = null) {
  const old = settings.planPerksBefore;
  const useOld = !!(date && old && date <= old.until);
  const all = useOld ? old.perks : (settings.planPerks || defaultPlanPerks());
  const plans = [...settings.plans].sort((a, b) => a.order - b.order);
  const me = plans.find(p => p.id === planId);
  if (!me) return { own: [], inherited: [], excluded: [], notes: [], tenure: '' };
  const inherited = [], excluded = [], notes = [];
  for (const p of plans.filter(p => p.order < me.order).sort((a, b) => b.order - a.order)) {
    const list = all[p.id] || [];
    excluded.push(...list.filter(x => x.noInherit));
    const perks = list.filter(x => !x.noInherit).map(x => (x.inheritAs ? { ...x.inheritAs, from: x.name } : x));
    notes.push(...list.filter(x => !x.noInherit && x.inheritNote).map(x => x.inheritNote));
    if (perks.length) inherited.push({ planId: p.id, perks });
  }
  const tenureRule = settings.rules.find(r => r.kind === 'tenure' && r.months === 12);
  return { own: all[planId] || [], inherited, excluded, notes, old: useOld, tenure: tenureRule ? tenureLabel(tenureRule, planId, useOld ? old.until : '9999-12-31') : '' };
}
