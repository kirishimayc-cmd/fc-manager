<div id="app"><div class="gate panel"><p>読み込み中…</p></div></div>
<input type="file" id="csvInput" accept=".csv,.json,text/csv,application/json" hidden>
<dialog id="dlg"></dialog>
<div class="dropcover">ここにドロップして読み込み</div>
<script>(function(){
// ---- config.js
// Google Cloud の値（ページに埋め込む前提の公開値。APIキーは github.io と Picker API に制限済み）
const GOOGLE = {
  clientId: '568003808881-9n9e56utr7cbptlt6ttlj9sdd8j75ejm.apps.googleusercontent.com',
  apiKey: 'AIzaSyB_22IXr8yX3GkkVFp6Jkn2IsGD9zW5d4k',
  appId: '568003808881',
};

// ---- dates.js
const pad = n => String(n).padStart(2, '0');
const fmt = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parts = s => s.split('-').map(Number);
const daysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

function toDate(s) {
  const m = String(s ?? '').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m ? fmt(Number(m[1]), Number(m[2]), Number(m[3])) : null;
}
function addMonths(d, n) {
  const [y, m, day] = parts(d);
  const t = y * 12 + (m - 1) + n, ny = Math.floor(t / 12), nm = t - ny * 12 + 1;
  return fmt(ny, nm, Math.min(day, daysIn(ny, nm)));
}
function addDays(d, n) {
  const [y, m, day] = parts(d);
  const x = new Date(Date.UTC(y, m - 1, day + n));
  return fmt(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate());
}
function daysBetween(a, b) {
  const [y1, m1, d1] = parts(a), [y2, m2, d2] = parts(b);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function diffMonthsDays(a, b) {
  let months = 0;
  while (compare(addMonths(a, months + 1), b) <= 0) months++;
  return { months, days: daysBetween(addMonths(a, months), b) };
}
const monthKey = d => d.slice(0, 7);
const compare = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
function endOfMonth(d) { const [y, m] = parts(d); return fmt(y, m, daysIn(y, m)); }
function todayLocal() { const x = new Date(); return fmt(x.getFullYear(), x.getMonth() + 1, x.getDate()); }

// ---- defaults.js
const PLAN_DEFS = [
  ['toriko', '虜プラン', 500], ['keiai', '敬愛プラン', 3000], ['suuhai', '崇拝プラン', 5000],
  ['ketsuniku', '血肉プラン', 10000], ['kyoai', '狂愛プラン', 30000],
];
function defaultSettings() {
  const plans = PLAN_DEFS.map(([id, name, price], order) => ({ id, name, price, order }));
  const all = plans.map(p => p.id);
  return {
    clubName: '生稚くれあファンクラブ',
    plans,
    rules: [
      { id: 'discord', kind: 'join', planIds: all, label: 'FCサーバー招待' },
      { id: 'kagiaka', kind: 'join', planIds: ['ketsuniku', 'kyoai'], label: '鍵垢X公開' },
      { id: 'call-ketsuniku', kind: 'interval', planIds: ['ketsuniku'], months: 3, label: '10分通話 or 名前呼びシチュボ', variants: ['通話', 'シチュボ'] },
      { id: 'call-kyoai', kind: 'interval', planIds: ['kyoai'], months: 1, label: '1時間通話券' },
      { id: 'birthday', kind: 'birthday', planIds: ['ketsuniku', 'kyoai'], label: 'お誕生日ビデオレター' },
      { id: 'tenure-12', kind: 'tenure', planIds: all, months: 12, label: '12か月継続特典',
        labelByPlan: { toriko: 'デジタル特典', keiai: 'ステッカー特典', suuhai: 'チャーム特典', ketsuniku: 'フィジカルグッズ特典', kyoai: 'フィジカルグッズ＆私物特典' } },
    ],
    updatedAt: '1970-01-01T00:00:00.000Z',
  };
}
function emptyData() {
  return { version: 5, settings: defaultSettings(), fans: {}, records: {}, meta: { migratedAt: null, lastSavedBy: '', lastSavedAt: '' } };
}
const planById = (s, id) => s.plans.find(p => p.id === id);
const planByName = (s, name) => s.plans.find(p => p.name === String(name).trim());

// ---- csv.js

function csvRecords(text) {
  const out = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); out.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}

const COLS = { planName: 'プラン名', name: 'ユーザー名', planJoinDate: '現在のプランの加入日', profileUrl: 'プロフィールページURL', memberNo: '会員番号' };

function parseCreatiaCsv(text) {
  const recs = csvRecords(text);
  const head = (recs.shift() || []).map(h => h.trim());
  const idx = Object.fromEntries(Object.entries(COLS).map(([k, h]) => [k, head.indexOf(h)]));
  const missing = Object.entries(idx).filter(([, i]) => i < 0).map(([k]) => COLS[k]);
  if (missing.length) return { rows: [], skipped: [{ line: 1, reason: '列が見つかりません：' + missing.join('、') }] };
  const rows = [], skipped = [];
  recs.forEach((r, n) => {
    const get = k => (r[idx[k]] || '').trim();
    const line = n + 2;
    if (!get('memberNo')) return skipped.push({ line, reason: '会員番号が空です' });
    if (!/^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}$/.test(get('planJoinDate'))) return skipped.push({ line, memberNo: get('memberNo'), reason: '加入日が読めません' });
    rows.push({ memberNo: get('memberNo'), name: get('name'), planName: get('planName'), planJoinDate: toDate(get('planJoinDate')), profileUrl: get('profileUrl') });
  });
  return { rows, skipped };
}

// ---- fans.js

const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));

function applyCsv(data, rows, today, keepMemberNos = []) {
  data = clone(data);
  const summary = { added: [], leftCandidates: [], rejoined: [], planChanged: [], skipped: [] };
  const seen = new Set(keepMemberNos), done = new Set();
  for (const r of rows) {
    const plan = planByName(data.settings, r.planName);
    if (!plan) { seen.add(r.memberNo); summary.skipped.push({ memberNo: r.memberNo, reason: '不明なプラン：' + r.planName }); continue; }
    if (done.has(r.memberNo)) { summary.skipped.push({ memberNo: r.memberNo, reason: '会員番号が重複しています' }); continue; }
    seen.add(r.memberNo); done.add(r.memberNo);
    let f = data.fans[r.memberNo];
    if (!f) {
      data.fans[r.memberNo] = { memberNo: r.memberNo, name: r.name, profileUrl: r.profileUrl, birthday: null, status: 'active',
        periods: [{ start: r.planJoinDate, end: null }], planHistory: [{ planId: plan.id, start: r.planJoinDate, end: null }], updatedAt: nowIso() };
      summary.added.push(r.memberNo); continue;
    }
    let touched = false;
    if (f.name !== r.name || f.profileUrl !== r.profileUrl) { f.name = r.name; f.profileUrl = r.profileUrl; touched = true; }
    if (f.status === 'left') {
      f.periods.push({ start: r.planJoinDate, end: null });
      f.planHistory.push({ planId: plan.id, start: r.planJoinDate, end: null });
      f.status = 'active'; summary.rejoined.push(r.memberNo); touched = true;
    } else {
      if (f.status === 'leftCandidate') { f.status = 'active'; touched = true; }
      const open = f.planHistory.find(h => h.end === null);
      if (open && open.planId !== plan.id) {
        open.end = addDays(r.planJoinDate, -1);
        f.planHistory.push({ planId: plan.id, start: r.planJoinDate, end: null });
        summary.planChanged.push(r.memberNo); touched = true;
      }
    }
    if (touched) f.updatedAt = nowIso();
  }
  for (const f of Object.values(data.fans)) {
    if (f.status === 'active' && !seen.has(f.memberNo)) {
      f.status = 'leftCandidate'; f.updatedAt = nowIso(); summary.leftCandidates.push(f.memberNo);
    }
  }
  return { data, summary };
}

function confirmLeft(data, memberNo, date) {
  data = clone(data);
  const f = data.fans[memberNo];
  f.status = 'left';
  f.periods.forEach(p => { if (p.end === null) p.end = date; });
  f.planHistory.forEach(h => { if (h.end === null) h.end = date; });
  f.updatedAt = nowIso();
  return data;
}

// ---- tenure.js

function reachDate(fan, months) {
  let accM = 0, accD = 0;
  for (const p of fan.periods) {
    const cand = addDays(addMonths(p.start, months - accM), -accD);
    if (p.end === null || compare(cand, p.end) <= 0) return cand;
    const d = diffMonthsDays(p.start, p.end);
    accM += d.months; accD += d.days;
  }
  return null;
}

function planOn(fan, date) {
  const h = fan.planHistory.find(h => compare(h.start, date) <= 0 && (h.end === null || compare(date, h.end) <= 0));
  return h ? h.planId : null;
}

function eligibleSince(fan, planIds, asOf) {
  const hs = fan.planHistory.filter(h => compare(h.start, asOf) <= 0);
  let i = hs.length - 1;
  if (i < 0 || !planIds.includes(hs[i].planId)) return null;
  while (i > 0 && planIds.includes(hs[i - 1].planId) && hs[i - 1].end && addDays(hs[i - 1].end, 1) === hs[i].start) i--;
  return hs[i].start;
}

// ---- obligations.js

function eligibleRuns(fan, planIds) {
  const runs = [];
  for (const h of fan.planHistory) {
    if (!planIds.includes(h.planId)) continue;
    const last = runs.at(-1);
    if (last && last.end && addDays(last.end, 1) === h.start) last.end = h.end;
    else runs.push({ start: h.start, end: h.end });
  }
  return runs;
}

function intervalTickets(fan, rule, horizon) {
  const out = [];
  for (const run of eligibleRuns(fan, rule.planIds)) {
    for (let k = 0; ; k++) {
      const ps = addMonths(run.start, k * rule.months);
      if (compare(ps, horizon) > 0 || (run.end && compare(ps, run.end) > 0)) break;
      out.push({ key: `${rule.id}|${fan.memberNo}|${ps}`, periodStart: ps, due: addDays(addMonths(run.start, (k + 1) * rule.months), -1) });
    }
  }
  return out;
}

const birthdayOn = (year, mmdd) => {
  const [m, d] = mmdd.split('-').map(Number);
  const leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  return `${year}-${String(m).padStart(2, '0')}-${String(m === 2 && d === 29 && !leap ? 28 : d).padStart(2, '0')}`;
};

function generate(data, today) {
  const items = [];
  const horizon = addMonths(today, 13);
  for (const fan of Object.values(data.fans)) {
    const base = { fanId: fan.memberNo, fanLeft: fan.status === 'left', count: 1, coversKeys: [], scheduled: false };
    for (const rule of data.settings.rules) {
      const push = (key, due, title) => items.push({ ...base, key, ruleId: rule.id, kind: rule.kind, title, due });
      if (rule.kind === 'join') {
        for (const run of eligibleRuns(fan, rule.planIds)) push(`${rule.id}|${fan.memberNo}|${run.start}`, run.start, rule.label);
      } else if (rule.kind === 'interval') {
        for (const t of intervalTickets(fan, rule, horizon)) items.push({ ...base, key: t.key, ruleId: rule.id, kind: rule.kind, title: rule.label, due: t.due, periodStart: t.periodStart });
      } else if (rule.kind === 'birthday') {
        if (!fan.birthday) continue;
        for (const run of eligibleRuns(fan, rule.planIds)) {
          for (let y = Number(run.start.slice(0, 4)); y <= Number(today.slice(0, 4)) + 1; y++) {
            const d = birthdayOn(y, fan.birthday);
            if (fan.birthdaySetOn && compare(d, fan.birthdaySetOn) < 0) continue;
            if (compare(d, run.start) >= 0 && (!run.end || compare(d, run.end) <= 0)) push(`${rule.id}|${fan.memberNo}|${y}`, d, rule.label);
          }
        }
      } else if (rule.kind === 'tenure') {
        const due = reachDate(fan, rule.months);
        if (!due) continue;
        const plan = planOn(fan, due);
        if (!plan || !rule.planIds.includes(plan)) continue;
        push(`${rule.id}|${fan.memberNo}|${rule.months}`, due, `${rule.months}か月継続：${(rule.labelByPlan && rule.labelByPlan[plan]) || rule.label}`);
      }
    }
  }
  return items;
}

const live = data => Object.values(data.records).filter(r => !r.deleted);
const latest = (rs) => rs.sort((a, b) => compare(a.updatedAt, b.updatedAt)).at(-1);

function computeList(data, today) {
  const recs = live(data);
  const settled = new Set();
  for (const r of recs) {
    if (r.type === 'delivered' || r.type === 'dismissed' || r.type === 'migrated') settled.add(r.key);
    if (r.type === 'delivered') (r.coversKeys || []).forEach(k => settled.add(k));
  }
  const byKey = new Map(), carries = new Map(), schedules = new Map();
  for (const r of recs) {
    if (r.type === 'carry') carries.set(r.key, latest([...(carries.has(r.key) ? [carries.get(r.key)] : []), r]));
    if (r.type === 'schedule') schedules.set(r.key, latest([...(schedules.has(r.key) ? [schedules.get(r.key)] : []), r]));
  }
  const extras = recs.filter(r => r.type === 'extra' && data.fans[r.fanId]).map(r => ({
    key: r.key, fanId: r.fanId, ruleId: 'extra', kind: 'extra', title: r.title, due: r.due, extraId: r.id,
    fanLeft: data.fans[r.fanId].status === 'left', count: 1, coversKeys: [], scheduled: false }));
  let items = [...generate(data, today), ...extras].filter(i => !settled.has(i.key));
  items.forEach(i => byKey.set(i.key, i));
  for (const i of items) {
    const s = schedules.get(i.key);
    if (s && s.scheduledDate) { i.due = s.scheduledDate; i.scheduled = true; }
  }
  items.sort((a, b) => compare(a.periodStart || a.due, b.periodStart || b.due));
  const hidden = new Set();
  for (const i of items) {
    const c = carries.get(i.key);
    if (!c) continue;
    const target = byKey.get(c.carryTo);
    if (!target) continue;
    target.count += i.count;
    target.coversKeys.push(i.key, ...i.coversKeys);
    hidden.add(i.key);
  }
  const limit = endOfMonth(addMonths(today, 1));
  const order = { overdue: 0, thisMonth: 1, nextMonth: 2, later: 3 };
  items = items.filter(i => !hidden.has(i.key) && (compare(i.due, limit) <= 0 || i.kind === 'extra')).map(i => {
    const status = compare(i.due, today) < 0 ? 'overdue' : monthKey(i.due) === monthKey(today) ? 'thisMonth' : compare(i.due, limit) <= 0 ? 'nextMonth' : 'later';
    const { periodStart, ...rest } = i;
    return { ...rest, status };
  }).sort((a, b) => order[a.status] - order[b.status] || compare(a.due, b.due) || compare(a.fanId, b.fanId));

  const active = Object.values(data.fans).filter(f => f.status !== 'left');
  const bdRules = data.settings.rules.filter(r => r.kind === 'birthday');
  const missingBirthday = active.filter(f => !f.birthday && bdRules.some(r => r.planIds.includes(planOn(f, today)))).map(f => f.memberNo);
  const decided = new Set(data.settings.rules.filter(r => r.kind === 'tenure').map(r => r.months));
  const soon = addMonths(today, 1);
  const undecidedMilestones = [24, 36].filter(m => !decided.has(m)).map(months => ({
    months, memberNos: active.filter(f => { const d = reachDate(f, months); return d && compare(d, soon) <= 0; }).map(f => f.memberNo),
  })).filter(x => x.memberNos.length);
  return { items, notices: { missingBirthday, undecidedMilestones } };
}

function nextIntervalKey(data, key) {
  const [ruleId, fanId, ps] = key.split('|');
  const rule = data.settings.rules.find(r => r.id === ruleId), fan = data.fans[fanId];
  if (!rule || !fan) return null;
  const ts = intervalTickets(fan, rule, addMonths(ps, rule.months * 2));
  const i = ts.findIndex(t => t.periodStart === ps);
  return i >= 0 && ts[i + 1] ? ts[i + 1].key : null;
}

function intervalTicketsFor(fan, rule, horizon) { return intervalTickets(fan, rule, horizon); }

const ISO_DAY = /^\d{4}-\d{2}-\d{2}$/;
function invalidDateFans(data) {
  const ok = d => d === null || ISO_DAY.test(d);
  return Object.values(data.fans).filter(f => !f.periods.every(p => ISO_DAY.test(p.start) && ok(p.end)) || !f.planHistory.every(h => ISO_DAY.test(h.start) && ok(h.end))).map(f => f.memberNo);
}

// ---- records.js

const copyData = d => JSON.parse(JSON.stringify(d));
const newId = device => `${device}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

function addRecord(data, fields, ctx) {
  data = copyData(data);
  let id = newId(ctx.device);
  while (data.records[id]) id = newId(ctx.device);
  data.records[id] = { id, ...fields, device: ctx.device, updatedAt: ctx.now, deleted: false };
  return data;
}

const deliver = (data, item, { date, memo = '', variant = '', minutes = null }, ctx) =>
  addRecord(data, { key: item.key, fanId: item.fanId, title: item.title || '', type: 'delivered', date, memo, variant, minutes, coversKeys: [...(item.coversKeys || [])] }, ctx);

const dismiss = (data, item, memo, ctx) =>
  addRecord(data, { key: item.key, fanId: item.fanId, title: item.title || '', type: 'dismissed', memo: memo || '' }, ctx);

const schedule = (data, key, fanId, scheduledDate, ctx) =>
  addRecord(data, { key, fanId, type: 'schedule', scheduledDate }, ctx);

const carry = (data, key, fanId, ctx) =>
  addRecord(data, { key, fanId, type: 'carry', carryTo: nextIntervalKey(data, key) }, ctx);

function removeRecord(data, recordId, ctx) {
  data = copyData(data);
  Object.assign(data.records[recordId], { deleted: true, updatedAt: ctx.now, device: ctx.device });
  return data;
}

function editRecord(data, recordId, patch, ctx) {
  data = copyData(data);
  Object.assign(data.records[recordId], patch, { updatedAt: ctx.now, device: ctx.device });
  return data;
}

function addExtra(data, fanIds, { title, due }, ctx) {
  data = copyData(data);
  for (const fanId of fanIds) {
    let id = newId(ctx.device);
    while (data.records[id]) id = newId(ctx.device);
    data.records[id] = { id, key: `extra|${fanId}|${id}`, fanId, type: 'extra', title, due, device: ctx.device, updatedAt: ctx.now, deleted: false };
  }
  return data;
}

// ---- merge.js
const deep = o => JSON.parse(JSON.stringify(o));
function newer(x, y) {
  if (!x) return y; if (!y) return x;
  const a = x.updatedAt || '', b = y.updatedAt || '';
  if (a !== b) return a > b ? x : y;
  return JSON.stringify(x) >= JSON.stringify(y) ? x : y;
}
function mergeMap(a = {}, b = {}) {
  const out = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) out[k] = newer(a[k], b[k]);
  return out;
}
function mergeFans(a = {}, b = {}) {
  const out = mergeMap(a, b);
  for (const k of Object.keys(out)) {
    const x = a[k], y = b[k];
    if (!x || !y) continue;
    const bx = x.birthdayUpdatedAt || '', by = y.birthdayUpdatedAt || '';
    if (bx === by) continue;
    const src = bx > by ? x : y;
    out[k] = { ...out[k], birthday: src.birthday, birthdayUpdatedAt: src.birthdayUpdatedAt, birthdaySetOn: src.birthdaySetOn || out[k].birthdaySetOn };
  }
  return out;
}
function mergeData(a, b) {
  if (!a) return deep(b); if (!b) return deep(a);
  const ma = a.meta || {}, mb = b.meta || {};
  const mig = [ma.migratedAt, mb.migratedAt].filter(Boolean).sort()[0] || null;
  const saver = (ma.lastSavedAt || '') >= (mb.lastSavedAt || '') ? ma : mb;
  return deep({
    version: 5,
    settings: newer(a.settings, b.settings),
    fans: mergeFans(a.fans, b.fans),
    records: mergeMap(a.records, b.records),
    meta: { migratedAt: mig, lastSavedBy: saver.lastSavedBy || '', lastSavedAt: saver.lastSavedAt || '' },
  });
}

// ---- migrate-v4.js

function migrateV4(v4, today, ctx) {
  if (!v4 || !v4.config || !v4.state || typeof v4.state.fans !== 'object') throw new Error('v4の書き出しファイルではありません');
  const settings = defaultSettings();
  if (v4.config.clubName) settings.clubName = v4.config.clubName;
  settings.updatedAt = ctx.now;
  const v4Plans = v4.config.plans || [];
  const toPlanId = raw => {
    const s = String(raw || '');
    const name = (v4Plans.find(p => p.id === s) || {}).name || s;
    const p = planByName(settings, name) || settings.plans.find(p => name.includes(p.name.replace(/プラン$/, '')));
    return p ? p.id : null;
  };
  const data = { version: 5, settings, fans: {}, records: {}, meta: { migratedAt: today, lastSavedBy: ctx.device, lastSavedAt: ctx.now } };
  let seq = 0;
  const add = r => { const id = `${ctx.device}-v4-${(seq++).toString(36)}`; data.records[id] = { id, src: 'v4', device: ctx.device, updatedAt: ctx.now, deleted: false, memo: '', ...r }; };

  const droppedFans = [];
  for (const f of Object.values(v4.state.fans)) {
    const id = String(f.id);
    const start = toDate(f.continuityStartDate) || toDate(f.join) || toDate(f.planJoinDate);
    const status = f.status === 'left' ? 'left' : f.status === 'candidate' ? 'leftCandidate' : 'active';
    const endAt = status === 'left' ? (toDate(f.leftDate) || today) : null;
    let hist = (Array.isArray(f.planHistory) && f.planHistory.length ? f.planHistory : [{ plan: f.plan, start: toDate(f.planJoinDate) || start, end: null }])
      .map(h => ({ planId: toPlanId(h.plan), start: toDate(h.start) || start, end: toDate(h.end) })).filter(h => h.planId && h.start);
    if (!hist.length) { droppedFans.push(f.name || id); continue; }
    if (start && start < hist[0].start) hist[0].start = start;
    if (endAt) hist.forEach(h => { if (h.end === null) h.end = endAt; });
    data.fans[id] = { memberNo: id, name: f.name || '', profileUrl: f.url || '', birthday: null, status,
      periods: [{ start: hist[0].start, end: endAt }], planHistory: hist, updatedAt: ctx.now };
  }

  for (const h of v4.state.history || []) {
    const id = String(h.id);
    if (!data.fans[id]) continue;
    add({ key: `tenure-${Number(h.months)}|${id}|${Number(h.months)}`, fanId: id, type: 'delivered', date: toDate(h.given) || toDate(h.target) || today, memo: [h.text, h.memo].filter(Boolean).join(' / ') || '' });
  }
  const usedTickets = new Set();
  for (const c of [...(v4.state.callHistory || [])].map(c => ({ ...c, date: toDate(c.date) })).filter(c => c.date).sort((a, b) => compare(a.date, b.date))) {
    const fan = data.fans[String(c.id)];
    if (!fan) continue;
    const plan = planOn(fan, c.date);
    const rule = settings.rules.find(r => r.kind === 'interval' && r.planIds.includes(plan));
    if (!rule) continue;
    // 期間内の通話はその期間の券。期間が始まって14日以内で、前の券が未使用なら「遅れた前回分」とみなす
    const ts = intervalTicketsFor(fan, rule, c.date).filter(t => compare(t.periodStart, c.date) <= 0);
    let t = ts.at(-1), prev = ts.at(-2);
    if (t && prev && !usedTickets.has(prev.key) && compare(c.date, addDays(t.periodStart, 14)) < 0) t = prev;
    if (!t || usedTickets.has(t.key)) continue;
    usedTickets.add(t.key);
    add({ key: t.key, fanId: fan.memberNo, type: 'delivered', date: c.date, minutes: Number(c.minutes) || null, memo: c.memo || '' });
  }
  let droppedPerkChecks = 0;
  const benefitName = (planKey, bid) => ((v4.state.planBenefits || {})[planKey] || []).find(b => b.id === bid);
  for (const [fid, recs] of Object.entries(v4.state.perkRecords || {})) {
    for (const [k, v] of Object.entries(recs || {})) {
      if (!v || !v.given || !data.fans[fid]) continue;
      const [pk, bid] = k.split('::');
      const name = (benefitName(pk, bid) || {}).name || '';
      const ruleId = /discord|サーバー/i.test(name) ? 'discord' : /鍵垢/.test(name) ? 'kagiaka' : null;
      if (!ruleId) { droppedPerkChecks++; continue; }
      const rule = settings.rules.find(r => r.id === ruleId);
      const run = data.fans[fid].planHistory.find(h => rule.planIds.includes(h.planId));
      if (run) add({ key: `${ruleId}|${fid}|${run.start}`, fanId: fid, type: 'delivered', date: toDate(v.date) || today });
    }
  }
  // 引き継いだ人の、移行日より前に期限が来ていた入会時・通話・誕生日は「引継ぎ済み」にする（1件ずつ戻せる）
  const settledKeys = new Set(Object.values(data.records).flatMap(r => [r.key, ...(r.coversKeys || [])]));
  for (const it of generate(data, today)) {
    if (it.kind === 'tenure' || compare(it.due, today) >= 0 || settledKeys.has(it.key)) continue;
    settledKeys.add(it.key);
    add({ key: it.key, fanId: it.fanId, title: it.title, type: 'migrated', memo: 'v4から引継ぎ（渡し済み扱い）' });
  }
  return { data, report: { droppedFans, fans: Object.keys(data.fans).length, records: Object.keys(data.records).length, droppedPerkChecks, droppedSchedules: (v4.state.callSchedules || []).length } };
}

// v4の読み込みをやり直すとき：ファンは新しい内容で上書きし、前回の読み込みで作られた記録のうち今回ないものは取り消す。
// v5で付けた記録（渡した・予定・次に回す など）はそのまま残す。
function mergeV4Import(current, migrated, now) {
  if (!current) return migrated;
  const fresh = JSON.parse(JSON.stringify(migrated));
  const isV4 = r => r.src === 'v4' || /-v4-[0-9a-z]+$/.test(r.id);
  // ユーザーが「未渡しに戻す」などで消した引継ぎ記録の key は、もう一度引き継がない
  const reopened = new Set(Object.values(current.records).filter(r => isV4(r) && r.deleted).map(r => r.key));
  for (const [id, r] of Object.entries(fresh.records)) {
    if (reopened.has(r.key) || (current.records[id] && current.records[id].deleted)) delete fresh.records[id];
  }
  // ファンは、今のデータで日付が読めない人・いない人だけ v4 の内容で直す（v5でのCSV取込などの変更は残す）
  const bad = new Set(invalidDateFans(current));
  for (const [no, f] of Object.entries(fresh.fans)) {
    if (current.fans[no] && !bad.has(no)) delete fresh.fans[no];
    else f.updatedAt = now;
  }
  const m = mergeData(current, fresh);
  const freshKeys = new Set(Object.values(fresh.records).map(r => r.key));
  for (const r of Object.values(m.records)) {
    if (isV4(r) && !r.deleted && !fresh.records[r.id] && !freshKeys.has(r.key) && !reopened.has(r.key)) Object.assign(r, { deleted: true, updatedAt: now });
  }
  return m;
}

// ---- storage.js

const DATA_FILE = 'fan_data.json';
const BACKUP_DIR = 'fan_data_backups';
const CONFLICT_RE = /^fan_data[- ].+\.json$/;
const KEEP = 5;
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };
const UNREADABLE = 'データファイルを読み込めません（OneDriveの同期中かもしれません）。少し待ってからもう一度開いてください。';
const withSaver = (data, device) => ({ ...data, meta: { ...(data.meta || {}), lastSavedBy: device, lastSavedAt: new Date().toISOString() } });

function createMemoryStorage({ disk = { file: null, conflicts: [], backups: [] }, deviceName = 'PC-TEST' } = {}) {
  let mtime = 0, seq = 0;
  const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
  async function readMerged() {
    if (disk.corrupt) throw new Error(UNREADABLE);
    let d = clone(disk.file);
    const ok = disk.conflicts.filter(c => !c.corrupt);
    if (ok.length) {
      if (d) disk.backups.push({ name: `before-conflict-${seq++}`, tag: 'conflict', data: clone(d) });
      for (const c of ok) d = mergeData(d, c.data);
      for (const c of ok) disk.conflicts.splice(disk.conflicts.indexOf(c), 1);
      disk.file = clone(d); mtime = Date.now() + (++seq);
    }
    return d;
  }
  return {
    init: async () => {}, status: () => 'ready', pick: async () => {}, regrant: async () => {},
    deviceName: () => deviceName, setDeviceName: n => { deviceName = n; },
    load: readMerged,
    async save(data) {
      const merged = withSaver(mergeData(await readMerged(), data), deviceName);
      disk.file = clone(merged); mtime = Date.now() + (++seq);
      return clone(merged);
    },
    async backup(data, tag) {
      disk.backups.push({ name: `fan_data_${stamp()}_${seq++}_${tag}.json`, tag, data: clone(data) });
      const mine = disk.backups.filter(b => b.tag === tag);
      while (mine.length > KEEP) disk.backups.splice(disk.backups.indexOf(mine.shift()), 1);
    },
    lastModified: async () => mtime,
  };
}

// ---- drive-storage.js

const API = 'https://www.googleapis.com/drive/v3/files';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const DRIVE_FOLDER = 'application/vnd.google-apps.folder';
const DATA_NAME = 'fan_data.json', FOLDER_NAME = 'FC管理', BACKUP_FOLDER = 'FC管理_バックアップ';
const FILE_KEY = 'fcm-v5-fileId', DEV_KEY = 'fcm-v5-device';
const KEEP_BACKUPS = 5;
const MSG = {
  offline: 'Googleドライブにつながりませんでした。ネットにつながってからもう一度試してください（今の操作は保存されていません）。',
  notFound: 'データファイルが見つかりません。ゴミ箱に移されたか、共有が外れた可能性があります。',
  forbidden: 'このアカウントにはデータファイルを編集する権限がありません。メインのアカウントから「編集可能」で共有してもらってください。',
  broken: 'データファイルを読み込めません（中身が壊れている可能性があります）。',
};
const q = s => s.replace(/'/g, "\\'");

function createDriveStorage({ fetchFn, auth, picker, local, deviceName }) {
  let state = 'needsLogin', fileId = local.get(FILE_KEY) || null, warns = [];
  let device = deviceName || local.get(DEV_KEY) || '';
  if (!device) { device = 'PC-' + Math.random().toString(36).slice(2, 6).toUpperCase(); local.set(DEV_KEY, device); }

  async function call(url, opts = {}, retried = false) {
    const token = await auth.getToken();
    let res;
    try { res = await fetchFn(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } }); }
    catch (e) { throw new Error(MSG.offline); }
    if (res.status === 401 && !retried) { await auth.refresh(); return call(url, opts, true); }
    if (res.status === 404) throw new Error(MSG.notFound);
    if (res.status === 403) throw new Error(MSG.forbidden);
    if (!res.ok) throw new Error(`Googleドライブでエラーが起きました（${res.status}）。少し待ってからもう一度試してください。`);
    return res;
  }
  const getJson = async (url, opts) => (await call(url, opts)).json();
  const list = async query => (await getJson(`${API}?q=${encodeURIComponent(query)}&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime)`)).files || [];
  async function create(name, mimeType, parents) {
    return getJson(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, mimeType, ...(parents ? { parents } : {}) }) });
  }
  const upload = (id, obj) => call(`${UPLOAD}/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
  async function folderId(name) {
    const found = await list(`name='${q(name)}' and mimeType='${DRIVE_FOLDER}' and 'me' in owners and trashed=false`);
    return found.length ? found[0].id : (await create(name, DRIVE_FOLDER)).id;
  }
  async function readRemote() {
    const text = await (await call(`${API}/${fileId}?alt=media`)).text();
    if (!text) return null;
    let d;
    try { d = JSON.parse(text); } catch (e) { throw new Error(MSG.broken); }
    if (!d || d.version !== 5 || !d.settings || !d.fans || !d.records) throw new Error('選ばれたファイルはこのツールのデータではありません。「ファイルを選び直す」で fan_data.json を選んでください。');
    return d;
  }
  function remember(id) { fileId = id; local.set(FILE_KEY, id); state = 'ready'; }
  const withSaver = data => ({ ...data, meta: { ...(data.meta || {}), lastSavedBy: device, lastSavedAt: new Date().toISOString() } });

  return {
    async init() {
      warns = [];
      if (!(await auth.restore())) { state = 'needsLogin'; return; }
      if (fileId) { state = 'ready'; return; }
      const owned = await list(`name='${DATA_NAME}' and 'me' in owners and trashed=false`);
      if (owned.length) {
        if (owned.length > 1) warns.push(`「${DATA_NAME}」がGoogleドライブに${owned.length}個あります。一番新しいものを使っています。古いものは整理してください。`);
        remember(owned[0].id);
      } else state = 'needsFile';
    },
    status: () => state,
    tokenValid: () => auth.signedIn(),
    forgetFile() { fileId = null; local.set(FILE_KEY, ''); state = 'needsFile'; },
    warnings: () => warns,
    folderName: () => `Googleドライブ / ${FOLDER_NAME}`,
    async login() { await auth.login(); await this.init(); },
    async pick() { return this.pickShared(); },
    async regrant() { await this.login(); },
    async pickShared() {
      const id = await picker.pickJson(await auth.getToken());
      if (!id) return false;
      remember(id);
      return true;
    },
    deviceName: () => device,
    setDeviceName(n) { device = n; local.set(DEV_KEY, n); },
    async load() { return fileId ? readRemote() : null; },
    async save(data) {
      if (!fileId) {
        const parent = await folderId(FOLDER_NAME);
        const merged = withSaver(mergeData(null, data));
        const { id } = await create(DATA_NAME, 'application/json', [parent]);
        await upload(id, merged);
        remember(id);
        return merged;
      }
      const merged = withSaver(mergeData(await readRemote(), data));
      await upload(fileId, merged);
      return merged;
    },
    async lastModified() {
      if (!fileId) return 0;
      const meta = await getJson(`${API}/${fileId}?fields=modifiedTime`);
      return Date.parse(meta.modifiedTime) || 0;
    },
    async backup(data, tag) {
      const parent = await folderId(BACKUP_FOLDER);
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const name = `fan_data_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2, 5)}_${tag}.json`;
      const { id } = await create(name, 'application/json', [parent]);
      await upload(id, data);
      const mine = (await list(`'${parent}' in parents and trashed=false`)).filter(f => f.name.endsWith(`_${tag}.json`));
      for (const f of mine.slice(KEEP_BACKUPS)) await call(`${API}/${f.id}`, { method: 'DELETE' });
    },
    async shareWith(email) {
      if (!fileId) throw new Error('先にデータを作ってください（「新しく始める」か「v4のデータを読み込む」）。');
      await call(`${API}/${fileId}/permissions?sendNotificationEmail=true`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'writer', type: 'user', emailAddress: email }) });
    },
  };
}

// ---- google.js
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const TOKEN_KEY = 'fcm-v5-token';
const scripts = {};
function loadScript(src) {
  if (!scripts[src]) scripts[src] = new Promise((ok, ng) => {
    const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok;
    s.onerror = () => { delete scripts[src]; ng(new Error('Googleの部品を読み込めませんでした。ネットにつながっているか確認してください。')); };
    document.head.appendChild(s);
  });
  return scripts[src];
}

function browserLocal() {
  return { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
}

function createGoogleAuth(clientId) {
  const local = browserLocal();
  let client = null, token = null, exp = 0, pending = null;
  try { const t = JSON.parse(local.get(TOKEN_KEY) || 'null'); if (t && t.exp > Date.now()) { token = t.token; exp = t.exp; } } catch (e) {}
  async function ensure() {
    await loadScript('https://accounts.google.com/gsi/client');
    if (!client) client = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId, scope: SCOPE,
      callback: r => {
        const p = pending; pending = null; if (!p) return;
        if (r.error) return p.ng(new Error('Googleのログインができませんでした：' + r.error));
        token = r.access_token; exp = Date.now() + (Number(r.expires_in || 3600) - 120) * 1000;
        local.set(TOKEN_KEY, JSON.stringify({ token, exp })); local.set('fcm-v5-signed', '1');
        p.ok(token);
      },
      error_callback: e => {
        const p = pending; pending = null; if (!p) return;
        p.ng(new Error(e && e.type === 'popup_closed' ? 'ログイン画面が閉じられました' : 'Googleのログイン画面を開けませんでした（ポップアップがブロックされていないか確認してください）'));
      },
    });
  }
  async function request(prompt) {
    if (pending) return pending.promise;      // 同時に何度呼ばれても、ログイン画面は1つだけ
    await ensure();
    if (pending) return pending.promise;
    let ok, ng; const promise = new Promise((a, b) => { ok = a; ng = b; });
    pending = { ok, ng, promise };
    client.requestAccessToken({ prompt });
    return promise;
  }
  return {
    signedIn: () => !!token && Date.now() < exp,
    async restore() { return !!token && Date.now() < exp; },
    async login() { await request(local.get('fcm-v5-signed') === '1' ? '' : 'consent'); },
    async getToken() { return token && Date.now() < exp ? token : request(''); },
    async refresh() { token = null; return request(''); },
  };
}

function createGooglePicker(apiKey, appId) {
  return {
    async pickJson(token) {
      await loadScript('https://apis.google.com/js/api.js');
      await new Promise(r => window.gapi.load('picker', r));
      const P = window.google.picker;
      return new Promise(ok => {
        const view = new P.DocsView(P.ViewId.DOCS).setMimeTypes('application/json').setOwnedByMe(false).setIncludeFolders(false);
        new P.PickerBuilder().setOAuthToken(token).setDeveloperKey(apiKey).setAppId(appId).addView(view).setLocale('ja')
          .setTitle('共有された fan_data.json を選んでください')
          .setCallback(d => { if (d.action === P.Action.PICKED) ok(d.docs[0].id); else if (d.action === P.Action.CANCEL) ok(null); })
          .build().setVisible(true);
      });
    },
  };
}

const KIND_META = {
  tenure: { icon: '🎁', label: '継続', color: '#b8283f' },
  interval: { icon: '📞', label: '通話', color: '#2f6fb3' },
  birthday: { icon: '🎂', label: '誕生日', color: '#c27a00' },
  join: { icon: '🔑', label: '入会時', color: '#4a7d3a' },
  extra: { icon: '🎰', label: '個別', color: '#7e4cc4' },
};
const KIND_ORDER = Object.keys(KIND_META);
const STATUS_ORDER = { overdue: 0, thisMonth: 1, nextMonth: 2, later: 3 };
const cmpStr = (a, b) => String(a).localeCompare(String(b), 'ja');

function sortItems(items, mode, nameOf) {
  const tie = (a, b) => cmpStr(a.due, b.due) || cmpStr(nameOf(a.fanId), nameOf(b.fanId));
  const by = {
    due: tie,
    name: (a, b) => cmpStr(nameOf(a.fanId), nameOf(b.fanId)) || cmpStr(a.due, b.due),
    kind: (a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || cmpStr(a.title || '', b.title || '') || tie(a, b),
  }[mode] || tie;
  return [...items].sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || by(a, b));
}

const filterItems = (items, kind) => (kind && kind !== 'all' ? items.filter(i => i.kind === kind) : items);

function sortFanRows(rows, key, dir) {
  const sign = dir === 'desc' ? -1 : 1;
  const val = r => (key === 'memberNo' ? Number(r.memberNo) : r[key]);
  return [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    const bx = x === null || x === undefined || x === '', by = y === null || y === undefined || y === '';
    if (bx || by) return bx === by ? 0 : bx ? 1 : -1;            // blanks always last
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : cmpStr(x, y);
    return c * sign || Number(a.memberNo) - Number(b.memberNo);
  });
}

async function boot() {

  try { await storage.init(); s = storage.status(); } catch (e) { return gate('Googleドライブにつながりません', h(e.message), 'もう一度試す', async () => boot()); }
  if (s === 'notConfigured') return gate('準備中です', 'Googleの設定値がまだ入っていません。');
  if (s === 'needsLogin') return gate('ファンクラブ管理ツール', 'Googleアカウントでログインして開きます。', 'Googleで開く', async () => { await storage.login(); boot(); });
  if (s === 'needsFile') return firstRun();

    data = await storage.load();
    lastMtime = await storage.lastModified();
  } catch (e) {
    return gate('データを読み込めません', h(e.message), 'もう一度読み込む', async () => boot(), repick(storage));

function gate(title, text, label, action, extra) {

  const run = fn => () => fn().catch(e => { if (e.name !== 'AbortError') alert('うまくいきませんでした：' + e.message); });
  if (label) $('#gateBtn').onclick = run(action);
  if (extra) $('#gateBtn2').onclick = run(extra.action);
}

async function refreshIfChanged() {
  if (!data || storage.status() !== 'ready') return;
  if (storage.tokenValid && !storage.tokenValid()) {
    const el = $('#banner');

  try {
    const m = await storage.lastModified();
    if (m && m !== lastMtime) { const d = await storage.load(); if (!d) return; data = d; lastMtime = m; render(); showRecentSaveBanner(); }

      <section class="panel"><h2>📅 もうすぐの節目</h2>${milestones.length ? `<ul class="dl">${milestones.slice(0, 8).map(m => `<li><span class="when">あと${daysTo(m.d)}日</span>${who(m.f)} ${badge(planOn(m.f, m.d))}<div class="muted small">${m.months}か月：${h(m.label)}（${ymd(m.d)}）</div></li>`).join('')}</ul>` : '<p class="muted">2か月以内に節目を迎える人はいません</p>'}</section>
      <section class="panel"><h2>👥 新規・退会候補</h2>
        <h4>新規（1か月以内） ${newcomers.length}人</h4>${newcomers.length ? `<p class="names">${newcomers.map(who).join('、')}</p>` : '<p class="muted small">なし</p>'}
        <h4>退会候補 ${candidates.length}人</h4>${candidates.length ? `<p class="names">${candidates.map(who).join('、')}</p><button class="link small" data-goto="members">会員名簿で確認する →</button>` : '<p class="muted small">なし</p>'}</section>
      <section class="panel span2"><h2>📊 プラン別の人数（在籍）</h2><div class="bars">${planRows.map(({ p, n }) => `<div class="bar"><span class="bl">${badge(p.id)}</span><span class="bt"><i style="width:${(n / maxN) * 100}%;background:${PLAN_COLORS[p.id] || '#999'}"></i></span><b>${n}人</b></div>`).join('')}</div></section>
    </div>`;
}

function renderList(list) {
  const head = `<div class="listhead"><h2>渡すものリスト</h2>${list.items.length ? `<div class="controls">
    <span class="ctl-label">並べ替え</span>${[['due', '期限順'], ['name', '名前順'], ['kind', '種類順']].map(([k, l]) => `<button class="sortbtn ${listSort === k ? 'on' : ''}" data-sort="${k}">${l}</button>`).join('')}
    <span class="ctl-label">絞り込み</span><button class="kindchip ${listKind === 'all' ? 'on' : ''}" data-kind="all">すべて ${list.items.length}</button>${Object.entries(KIND_META).map(([k, m]) => { const n = list.items.filter(i => i.kind === k).length; return n ? `<button class="kindchip ${listKind === k ? 'on' : ''}" data-kind="${k}" style="--k:${m.color}">${m.icon}${m.label} ${n}</button>` : ''; }).join('')}
  </div>` : ''}</div>`;
  if (!list.items.length) return head + `<div class="empty">今月・来月に渡すものはありません 🎉</div>`;
  const shown = sortItems(filterItems(list.items, listKind), listSort, fanName);
  return head + GROUPS.map(([st, label]) => {
    const its = shown.filter(i => i.status === st);
    if (!its.length) return '';
    return `<div class="group ${st}"><div class="glabel">${st === 'overdue' ? '⚠ ' : ''}${label}<span>${its.length}</span></div>${its.map(itemRow).join('')}</div>`;
  }).join('') || '<div class="empty">この種類の渡すものはありません</div>';
}

function itemRow(i) {
  const f = data.fans[i.fanId] || {};
  const plan = planOn(f, i.due) || planOn(f, today) || (f.planHistory || []).at(-1)?.planId;
  const meta = KIND_META[i.kind] || { icon: '・', label: '', color: '#777' };
  const tags = [i.count > 1 ? `<span class="tag strong">${i.count}回分</span>` : '', i.scheduled ? '<span class="tag">予定</span>' : '', i.fanLeft ? '<span class="tag gray">退会済み</span>' : ''].join('');
  const btns = [`<button class="btn primary deliver">渡した</button>`,
    i.kind === 'interval' ? `<button class="btn ghost sched">予定日</button><button class="btn ghost carry">次に回す</button>` : '',
    i.fanLeft ? `<button class="btn ghost dismiss">対象外</button>` : '',
    i.kind === 'extra' ? `<button class="btn ghost cancelExtra">取消</button>` : ''].join('');
  return `<div class="item" data-key="${h(i.key)}" data-kind="${h(i.kind)}">
    <div class="due">${i.scheduled ? '<small>予定</small>' : ''}${md(i.due)}</div>
    <div class="who">${h(f.name || i.fanId)} ${badge(plan)}</div>
    <div class="what"><span class="kindtag" style="--k:${meta.color}">${meta.icon}</span>${h(i.title)} ${tags}</div>
    <div class="btns">${btns}</div></div>`;
}

function renderNotices(n) {
  const parts = [];
  const bad = invalidDateFans(data);
  if (bad.length) parts.push(`<div class="notice warn-strong">⚠ 日付が読めないファンが${bad.length}人います（${bad.slice(0, 5).map(fanName).map(h).join('、')}${bad.length > 5 ? ' ほか' : ''}）。この人たちの特典はリストに出ません。v4のデータをもう一度読み込んでください。</div>`);
  if (n.missingBirthday.length) parts.push(`<div class="notice">🎂 誕生日が未入力の人：${n.missingBirthday.map(id => `<button class="link fanlink" data-id="${h(id)}">${h(fanName(id))}</button>`).join('、')}</div>`);
  for (const u of n.undecidedMilestones) parts.push(`<div class="notice">⭐ もうすぐ${u.months}か月の人がいます（${u.memberNos.map(fanName).map(h).join('、')}）。${u.months}か月の特典を決めますか？ <button class="link" id="decide${u.months}">特典を決める</button></div>`);
  return parts.length ? `<section id="notices">${parts.join('')}</section>` : '';
}

function tenureMonths(f) {
  let m = 0;
  for (const p of f.periods) m += diffMonthsDays(p.start, p.end && compare(p.end, today) < 0 ? p.end : today).months;
  return m;
}

function renderFans() {
  const all = Object.values(data.fans);
  const recent = addMonths(today, -1);
  const filters = [['active', '在籍', f => f.status === 'active'], ['new', '新規（1か月以内）', f => f.status !== 'left' && compare(f.periods.at(-1).start, recent) >= 0],
    ['leftCandidate', '退会候補', f => f.status === 'leftCandidate'], ['left', '退会', f => f.status === 'left'], ['all', 'すべて', () => true]];
  const pred = (filters.find(x => x[0] === fanFilter) || filters[0])[2];
  const planOrder = id => (planById(data.settings, id) || { order: 99 }).order;
  const rows = sortFanRows(all.filter(pred).map(f => {
    const cur = planOn(f, today) || f.planHistory.at(-1).planId;
    const next = data.settings.rules.filter(r => r.kind === 'tenure').map(r => reachDate(f, r.months)).filter(d => d && compare(d, today) >= 0).sort()[0] || null;
    return { f, memberNo: f.memberNo, name: f.name, plan: planOrder(cur), planId: cur, status: ['active', 'leftCandidate', 'left'].indexOf(f.status), months: tenureMonths(f), next, birthday: f.birthday };
  }), fanSort.key, fanSort.dir);
  const cols = [['memberNo', 'No', 'num'], ['name', '名前', ''], ['plan', 'プラン', ''], ['status', '状態', ''], ['months', '在籍', 'r'], ['next', '次の継続特典', ''], ['birthday', '誕生日', '']];
  const arrow = k => (fanSort.key === k ? (fanSort.dir === 'asc' ? ' ▲' : ' ▼') : '');
  const daysTo = d => Math.round((Date.parse(d) - Date.parse(today)) / 86400000);
  const body = rows.map(({ f, planId, months, next }) => `<tr><td class="num">${h(f.memberNo)}</td><td><button class="link fanlink" data-id="${h(f.memberNo)}">${h(f.name)}</button></td><td>${badge(planId)}</td>
      <td><span class="st st-${f.status}">${STATUS_LABEL[f.status]}</span></td><td class="r">${months}か月</td>
      <td>${next ? `<b>あと${daysTo(next)}日</b> <span class="muted">（${ymd(next)}）</span>` : '<span class="muted">-</span>'}</td><td>${f.birthday ? f.birthday.replace('-', '/') : '<span class="muted">-</span>'}</td>
      <td>${f.status === 'leftCandidate' ? `<button class="btn small danger leftbtn" data-id="${h(f.memberNo)}">退会確定</button>` : ''}</td></tr>`).join('');
  return `<div class="chips">${filters.map(([k, l, p]) => `<button class="chip ${fanFilter === k ? 'on' : ''}" data-filter="${k}">${l} ${all.filter(p).length}</button>`).join('')}</div>
    ${body ? `<div class="scroll"><table class="fans"><thead><tr>${cols.map(([k, l, c]) => `<th class="sortable ${c}" data-key="${k}">${l}${arrow(k)}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty">該当するファンはいません</div>'}`;
}

function recordTitle(r) {
  if (r.title) return r.title;
  const rule = ruleOf(r.key);
  if (!rule) { const m = r.key.match(/^tenure-(\d+)/); return m ? `${m[1]}か月継続` : r.key; }
  return rule.kind === 'tenure' ? `${rule.months}か月継続` : rule.label;
}

function renderRecords() {
  const recs = Object.values(data.records).filter(r => !r.deleted && (r.type === 'delivered' || r.type === 'dismissed'))
    .sort((a, b) => compare(b.date || b.updatedAt, a.date || a.updatedAt) || compare(b.updatedAt, a.updatedAt));
  if (!recs.length) return '<div class="empty">まだ記録はありません</div>';
  return `<div class="scroll"><table><thead><tr><th>渡した日</th><th>名前</th><th>内容</th><th>メモ</th><th>記録したPC</th><th></th></tr></thead><tbody>${recs.map(r => `
    <tr class="record"><td>${r.type === 'dismissed' ? '<span class="tag gray">対象外</span>' : ymd(r.date)}</td><td>${h(fanName(r.fanId))}</td>
    <td>${h(recordTitle(r))}${r.variant ? `（${h(r.variant)}）` : ''}${r.minutes ? ` ${r.minutes}分` : ''}${(r.coversKeys || []).length ? ` <span class="tag">${r.coversKeys.length + 1}回分</span>` : ''}</td>
    <td>${h(r.memo)}</td><td class="muted">${h(r.device)}</td>
    <td class="nowrap"><button class="btn small ghost editrec" data-id="${h(r.id)}">修正</button><button class="btn small ghost delrec" data-id="${h(r.id)}">削除</button></td></tr>`).join('')}</tbody></table></div>`;
}

function renderRevenue() {
  const active = Object.values(data.fans).filter(f => f.status === 'active');
  const byPlan = data.settings.plans.map(p => { const n = active.filter(f => planOn(f, today) === p.id).length; return { p, n, sum: n * p.price }; });
  const total = byPlan.reduce((s, x) => s + x.sum, 0);
  const support = f => f.planHistory.reduce((s, ph) => {
    if (compare(ph.start, today) > 0) return s;
    const end = ph.end && compare(ph.end, today) < 0 ? ph.end : today;
    const p = planById(data.settings, ph.planId);
    return s + (diffMonthsDays(ph.start, end).months + 1) * (p ? p.price : 0);
  }, 0);
  const fans = Object.values(data.fans).map(f => ({ f, s: support(f) })).sort((a, b) => b.s - a.s);
  return `<div class="grid2"><div><h3>プラン別（在籍中）</h3><table><tbody>${byPlan.map(x => `<tr><td>${badge(x.p.id)}</td><td>${yen(x.p.price)}</td><td>${x.n}人</td><td class="r"><b>${yen(x.sum)}</b></td></tr>`).join('')}
    <tr class="total"><td colspan="3">月額合計</td><td class="r"><b>${yen(total)}</b></td></tr></tbody></table>
    <p class="muted small">支援額はプランの在籍月数（開始月を含む）× 月額で計算した目安です。</p></div>
    <div><h3>ユーザー別 累計支援額</h3><div class="scroll short"><table><tbody>${fans.map(({ f, s }) => `<tr><td>${h(f.name)}</td><td>${STATUS_LABEL[f.status]}</td><td class="r">${yen(s)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

// ---------- wiring ----------
function wire(list) {
  $('#csvBtn').onclick = () => $('#csvInput').click();
  $('#extraBtn').onclick = openExtra;
  document.querySelectorAll('.nav').forEach(b => b.onclick = () => { page = b.dataset.page; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { page = b.dataset.goto; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('.sortbtn').forEach(b => b.onclick = () => { listSort = b.dataset.sort; render(); });
  document.querySelectorAll('.kindchip').forEach(b => b.onclick = () => { listKind = b.dataset.kind; render(); });
  const byKey = Object.fromEntries(list.items.map(i => [i.key, i]));
  document.querySelectorAll('#page .item').forEach(row => {
    const it = byKey[row.dataset.key];
    row.querySelector('.deliver').onclick = () => openDeliver(it);
    const s = row.querySelector('.sched'); if (s) s.onclick = () => openSchedule(it);
    const c = row.querySelector('.carry'); if (c) c.onclick = () => openCarry(it);
    const x = row.querySelector('.cancelExtra');
    if (x) x.onclick = () => openDialog('特典を取り消す', `<p>${h(fanName(it.fanId))}さんの「${h(it.title)}」を取り消します。</p>`, { ok: '取り消す', danger: true, onOk: () => commit(removeRecord(data, it.extraId, ctx())) });
    const d = row.querySelector('.dismiss'); if (d) d.onclick = () => openDialog('対象外にする', `<p>${h(fanName(it.fanId))}さんの「${h(it.title)}」をリストから外します。</p><label>メモ<input name="memo" placeholder="例：退会のため"></label>`,
      { ok: '対象外にする', onOk: dl => commit(dismiss(data, it, dl.querySelector('[name=memo]').value, ctx())) });
  });
  for (const u of list.notices.undecidedMilestones) { const b = $('#decide' + u.months); if (b) b.onclick = () => openRuleEditor(null, { kind: 'tenure', months: u.months }); }
  if (page === 'settings') wireSettings();
  wireTab();
}

function wireTab() {
  document.querySelectorAll('.fanlink').forEach(b => b.onclick = () => openFan(b.dataset.id));
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { fanFilter = b.dataset.filter; $('#tabContent').innerHTML = renderFans(); wireTab(); });
  document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    fanSort = fanSort.key === k ? { key: k, dir: fanSort.dir === 'asc' ? 'desc' : 'asc' } : { key: k, dir: 'asc' };
    $('#tabContent').innerHTML = renderFans(); wireTab();
  });
  document.querySelectorAll('.leftbtn').forEach(b => b.onclick = () => openDialog('退会を確定', `<p>${h(fanName(b.dataset.id))}さんを退会として記録します。再入会したときは、在籍していた月数から続きを数えます。</p><label>退会日<input type="date" name="date" value="${today}" required></label>`,
    { ok: '退会確定', danger: true, onOk: dl => commit(touchFan(confirmLeft(data, b.dataset.id, dl.querySelector('[name=date]').value), b.dataset.id)) }));
  document.querySelectorAll('.editrec').forEach(b => b.onclick = () => {
    const r = data.records[b.dataset.id];
    openDialog('記録を修正', `<label>渡した日<input type="date" name="date" value="${h(r.date || '')}"></label><label>メモ<input name="memo" value="${h(r.memo || '')}"></label>`,
      { ok: '保存', onOk: dl => commit(editRecord(data, r.id, { date: dl.querySelector('[name=date]').value, memo: dl.querySelector('[name=memo]').value }, ctx())) });
  });
  document.querySelectorAll('.delrec').forEach(b => b.onclick = () => openDialog('記録を削除', `<p>この記録を削除すると、渡すものリストに戻ります。</p>`,
    { ok: '削除', danger: true, onOk: () => commit(removeRecord(data, b.dataset.id, ctx())) }));
}

const touchFan = (d, id) => { d.fans[id].updatedAt = new Date().toISOString(); return d; };

function openDeliver(it) {
  const rule = ruleOf(it.key) || {};
  const variants = (rule.variants || []).map((v, n) => `<label class="inline"><input type="radio" name="variant" value="${h(v)}" ${n === 0 ? 'checked' : ''}> ${h(v)}</label>`).join('');
  openDialog('渡した', `<p><b>${h(fanName(it.fanId))}</b>さん：${h(it.title)}${it.count > 1 ? `（${it.count}回分をまとめて）` : ''}</p>
    ${variants ? `<div class="field">内容 ${variants}</div>` : ''}
    <label>渡した日<input type="date" name="date" value="${today}" required></label>
    ${it.kind === 'interval' ? '<label>通話時間（分・任意）<input type="number" name="minutes" min="0"></label>' : ''}
    <label>メモ（任意）<input name="memo"></label>`, {
    ok: '記録する', onOk: dl => {
      const v = dl.querySelector('[name=variant]:checked'), m = dl.querySelector('[name=minutes]');
      return commit(deliver(data, it, { date: dl.querySelector('[name=date]').value, memo: dl.querySelector('[name=memo]').value, variant: v ? v.value : '', minutes: m && m.value ? Number(m.value) : null }, ctx()));
    },
  });
}

function openSchedule(it) {
  openDialog('予定日を決める', `<p>${h(fanName(it.fanId))}さん：${h(it.title)}</p><label>予定日（月をまたいでもOK）<input type="date" name="date" value="${it.scheduled ? it.due : ''}" required></label>`,
    { ok: '保存', onOk: dl => commit(schedule(data, it.key, it.fanId, dl.querySelector('[name=date]').value, ctx())) });
}

function openCarry(it) {
  openDialog('次に回す', `<p>${h(fanName(it.fanId))}さんの「${h(it.title)}」を次の回に回します。次の回は「${it.count + 1}回分」として表示され、1回の通話でまとめて「渡した」にできます。</p>`,
    { ok: '次に回す', onOk: () => {
      const d = carry(data, it.key, it.fanId, ctx());
      if (!Object.values(d.records).at(-1).carryTo) { alert('次の回が見つかりませんでした（プラン変更などで対象外になっている可能性があります）'); return false; }
      return commit(d);
    } });
}

function openFan(id) {
  setTimeout(() => document.querySelectorAll('#dlg .unmig').forEach(b => b.onclick = () => { $('#dlg').close(); commit(removeRecord(data, b.dataset.id, ctx())); }), 0);
  const f = data.fans[id];
  const recs = Object.values(data.records).filter(r => r.fanId === id && !r.deleted && (r.type === 'delivered' || r.type === 'dismissed')).sort((a, b) => compare(b.date || '', a.date || ''));
  const migrated = Object.values(data.records).filter(r => r.fanId === id && !r.deleted && r.type === 'migrated');
  const [bm, bd] = (f.birthday || '-').split('-');
  openDialog(f.name, `
    <p>${badge(planOn(f, today) || f.planHistory.at(-1).planId)} ${STATUS_LABEL[f.status]}　在籍 ${tenureMonths(f)}か月　会員番号 ${h(f.memberNo)}${/^https?:\/\//i.test(f.profileUrl || '') ? `　<a href="${h(f.profileUrl)}" target="_blank" rel="noopener">プロフィール</a>` : ''}</p>
    <div class="field">誕生日 <select name="bm"><option value="">-</option>${Array.from({ length: 12 }, (_, i) => `<option ${Number(bm) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>月
      <select name="bd"><option value="">-</option>${Array.from({ length: 31 }, (_, i) => `<option ${Number(bd) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>日</div>
    <h4>プランの変遷</h4><ul class="plain">${f.planHistory.map(ph => `<li>${badge(ph.planId)} ${ymd(ph.start)} 〜 ${ph.end ? ymd(ph.end) : '継続中'}</li>`).join('')}</ul>
    <h4>在籍期間</h4><ul class="plain">${f.periods.map(p => `<li>${ymd(p.start)} 〜 ${p.end ? ymd(p.end) : '継続中'}</li>`).join('')}</ul>
    <h4>渡した記録</h4>${recs.length ? `<ul class="plain">${recs.map(r => `<li>${r.type === 'dismissed' ? '対象外' : ymd(r.date)}　${h(recordTitle(r))}${r.memo ? `　<span class="muted">${h(r.memo)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="muted">まだありません</p>'}
    ${migrated.length ? `<h4>v4から引継ぎ（渡し済み扱い）</h4><ul class="plain">${migrated.map(r => `<li>${h(recordTitle(r))}　<span class="muted">${h(r.key.split('|')[2] || '')}</span> <button type="button" class="link unmig" data-id="${h(r.id)}">未渡しに戻す</button></li>`).join('')}</ul>` : ''}`, {
    ok: '保存', wide: true, onOk: dl => {
      const m = dl.querySelector('[name=bm]').value, d = dl.querySelector('[name=bd]').value;
      const bday = m && d ? `${m.padStart(2, '0')}-${d.padStart(2, '0')}` : null;
      if (bday === f.birthday) return;
      const next = JSON.parse(JSON.stringify(data));
      next.fans[id].birthday = bday;
      next.fans[id].birthdayUpdatedAt = new Date().toISOString();
      if (bday && !next.fans[id].birthdaySetOn) next.fans[id].birthdaySetOn = today;
      return commit(touchFan(next, id));
    },
  });
}

// ---------- files ----------
document.addEventListener('change', e => { if (e.target.id === 'csvInput' && e.target.files[0]) { handleFile(e.target.files[0]); e.target.value = ''; } });

async function handleFile(file) {
  const text = await file.text();
  if (/\.csv$/i.test(file.name)) return previewCsv(text);
  let json;
  try { json = JSON.parse(text); } catch (e) { return alert('読み込めないファイルです'); }
  if (json && json.config && json.state) return previewV4(json);
  if (json && json.version === 5) return openDialog('書き出したデータを読み込む', '<p>このファイルの内容を今のデータと合体させます（どちらかにしかない記録はすべて残ります）。</p>',
    { ok: '読み込む', onOk: async () => { if (data) await storage.backup(data, 'import'); return commit(mergeData(data, json)); } });
  alert('対応していないファイルです（CreatiaのCSV、v4の書き出しデータ、v5の書き出しデータに対応）');
}

function previewCsv(text) {
  if (!data) return alert('先に「v4のデータを読み込む」か「新しく始める」を選んでください');
  const parsed = parseCreatiaCsv(text);
  if (!parsed.rows.length) return openDialog('このCSVは取り込めません', `<p>読み取れる行がありませんでした。CreatiaのファンリストCSVか確認してください。</p>${parsed.skipped.length ? `<div class="notice small">${parsed.skipped.map(s => h(`${s.line}行目：${s.reason}`)).join('<br>')}</div>` : ''}`);
  const keep = parsed.skipped.map(s => s.memberNo).filter(Boolean);
  const { data: next, summary } = applyCsv(data, parsed.rows, today, keep);
  const skipped = [...parsed.skipped.map(s => `${s.line}行目：${s.reason}`), ...summary.skipped.map(s => `会員番号${s.memberNo}：${s.reason}`)];
  const names = ids => ids.map(fanNameIn(next)).map(h).join('、');
  openDialog('CSVの取り込み', `<div class="csv-summary">
    <p>新規 <b>${summary.added.length}</b>人　退会候補 <b>${summary.leftCandidates.length}</b>人　再入会 <b>${summary.rejoined.length}</b>人　プラン変更 <b>${summary.planChanged.length}</b>人</p>
    ${summary.added.length ? `<p class="small">新規：${names(summary.added)}</p>` : ''}
    ${summary.leftCandidates.length ? `<p class="small">退会候補：${names(summary.leftCandidates)}</p>` : ''}
    ${summary.rejoined.length ? `<p class="small">再入会（在籍月数は続きから）：${names(summary.rejoined)}</p>` : ''}
    ${summary.planChanged.length ? `<p class="small">プラン変更：${names(summary.planChanged)}</p>` : ''}
    ${skipped.length ? `<div class="notice small">読み飛ばした行：<br>${skipped.map(h).join('<br>')}</div>` : ''}
    <p class="muted small">取り込む前の状態はバックアップされます（直近5回分）。</p></div>`,
    { ok: '取り込む', onOk: async () => { await storage.backup(data, 'csv'); return commit(next); } });
}
const fanNameIn = d => id => (d.fans[id] ? d.fans[id].name : id);

function previewV4(v4) {
  let res;
  try { res = migrateV4(v4, today, ctx()); } catch (e) { return alert(e.message); }
  const { data: migrated, report } = res;
  openDialog('v4のデータを読み込む', `<div class="csv-summary"><p>ファン <b>${report.fans}</b>人、記録 <b>${report.records}</b>件を引き継ぎます。</p>
    <p class="small">・今いる人の、今日より前に期限が来ていた入会時の特典・通話・誕生日は渡し済みとして扱います（ファンの詳細から1件ずつ「未渡し」に戻せます）<br>・12か月を過ぎているのに記録がない人は「期限切れ」に出ます<br>・ログイン情報は引き継ぎません</p>
    ${report.droppedFans.length ? `<div class="notice small">プランが読み取れず引き継げないファン：${report.droppedFans.map(h).join('、')}</div>` : ''}
    ${report.droppedPerkChecks ? `<p class="small muted">新しい特典ルールに当てはまらないプラン特典のチェック ${report.droppedPerkChecks}件は引き継ぎません。</p>` : ''}
    ${report.droppedSchedules ? `<p class="small muted">v4の通話予定 ${report.droppedSchedules}件は引き継ぎません（必要なら「予定日」で入れ直してください）。</p>` : ''}
    ${data ? '<p class="small">前回の読み込み分は今回の内容で上書きします。v5で付けた「渡した」などの記録はそのまま残ります。</p>' : ''}</div>`,
    { ok: '読み込む', onOk: async () => { if (data) await storage.backup(data, 'v4'); return commit(data ? mergeV4Import(data, migrated, new Date().toISOString()) : migrated); } });
}

// ---------- settings ----------
function renderSettings() {
  const rules = data.settings.rules.map(r => `<tr><td>${h(KIND_LABEL[r.kind])}${r.months ? `（${r.months}か月）` : ''}</td>
    <td>${h(r.label)}</td><td>${r.planIds.map(badge).join('')}</td><td class="nowrap"><button type="button" class="btn small ghost editrule" data-id="${h(r.id)}">編集</button></td></tr>`).join('');
  return `
    <section class="panel"><h2>基本</h2>
      <label>ファンクラブ名<input name="club" value="${h(data.settings.clubName)}"></label>
      <label>このPCの名前（もう1台と区別するため）<input name="device" value="${h(storage.deviceName())}"></label>
      <button class="btn primary" id="saveSettings">保存</button></section>
    <section class="panel"><div class="secthead"><h2>特典ルール</h2><button type="button" class="btn small ghost" id="addRule">＋追加</button></div>
      <table><tbody>${rules}</tbody></table></section>
    <section class="panel"><h2>もう1台のアカウントと共有</h2>
      ${storage.shareWith ? `<div class="row"><input id="shareEmail" type="email" placeholder="もう1台のGoogleアカウントのメールアドレス" style="flex:1"><button type="button" class="btn ghost" id="shareBtn">編集可能で共有</button></div>
      <p class="small muted">共有したら、もう1台のPCでツールを開いて「共有されたデータを開く」を押してください。</p>` : '<p class="muted small">このモードでは共有できません</p>'}
      ${storage.forgetFile ? '<p class="small"><button type="button" class="link" id="switchShared">共有されたデータに切り替える／ファイルを選び直す</button></p>' : ''}</section>
    <section class="panel"><h2>データ</h2>
      <p class="small muted">保存先：${h(storage.folderName ? storage.folderName() : '')} の fan_data.json（バックアップは FC管理_バックアップ フォルダ）</p>
      <div class="row"><button type="button" class="btn ghost" id="exportBtn">データを書き出す</button><button type="button" class="btn ghost" id="importBtn">バックアップから読み込む</button></div></section>`;
}

function wireSettings() {
  const d = $('#page');
  d.querySelector('#saveSettings').onclick = () => {
    const club = d.querySelector('[name=club]').value.trim(), dev = d.querySelector('[name=device]').value.trim();
    if (dev && dev !== storage.deviceName()) storage.setDeviceName(dev);
    if (club && club !== data.settings.clubName) return commit(withSettings(s => { s.clubName = club; }));
    render();
  };
  const sw = d.querySelector('#switchShared');
  if (sw) sw.onclick = () => { if (confirm('今開いているデータから離れて、Googleドライブのファイルを選び直します。よろしいですか？（データは消えません）')) { storage.forgetFile(); boot(); } };
  const sb = d.querySelector('#shareBtn');
  if (sb) sb.onclick = async () => {
    const email = d.querySelector('#shareEmail').value.trim();
    if (!/^[^@\s]+@[^@\s]+$/.test(email)) return alert('メールアドレスを入れてください');
    try { await storage.shareWith(email); alert(email + ' に共有しました（Googleから案内メールが届きます）'); } catch (e) { alert(e.message); }
  };
  d.querySelector('#addRule').onclick = () => openRuleEditor(null, { kind: 'tenure', months: 24 });
  d.querySelectorAll('.editrule').forEach(b => b.onclick = () => openRuleEditor(b.dataset.id));
  d.querySelector('#exportBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    a.download = `fan_data_export_${today}.json`; a.click();
  };
  d.querySelector('#importBtn').onclick = () => $('#csvInput').click();
}

function withSettings(fn) {
  const next = JSON.parse(JSON.stringify(data));
  fn(next.settings);
  next.settings.updatedAt = new Date().toISOString();
  return next;
}

function openRuleEditor(ruleId, preset = {}) {
  const r = ruleId ? data.settings.rules.find(x => x.id === ruleId) : { id: '', kind: preset.kind || 'tenure', months: preset.months || 12, planIds: data.settings.plans.map(p => p.id), label: '', labelByPlan: {} };
  const planChecks = data.settings.plans.map(p => `<label class="inline"><input type="checkbox" name="plan" value="${p.id}" ${r.planIds.includes(p.id) ? 'checked' : ''}> ${h(p.name)}</label>`).join('');
  const perPlan = data.settings.plans.map(p => `<label class="inline-wide">${h(p.name)}<input name="lbp-${p.id}" value="${h((r.labelByPlan || {})[p.id] || '')}"></label>`).join('');
  const d = openDialog(ruleId ? '特典ルールを編集' : '特典ルールを追加', `
    <label>種類<select name="kind" ${ruleId ? 'disabled' : ''}>${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}" ${r.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="months">月数<input type="number" name="months" min="1" value="${h(r.months || '')}"></label>
    <label>特典名<input name="label" value="${h(r.label)}" placeholder="例：24か月継続特典"></label>
    <div class="field">対象プラン<br>${planChecks}</div>
    <div class="perplan"><div class="field">プランごとの特典名（継続◯か月のとき。空欄なら上の特典名）</div>${perPlan}</div>
    ${ruleId ? '<p><button type="button" class="btn small danger" id="delRule">このルールを削除</button></p>' : ''}`, {
    ok: '保存', wide: true, onOk: dl => {
      const kind = dl.querySelector('[name=kind]').value, months = Number(dl.querySelector('[name=months]').value) || null;
      const label = dl.querySelector('[name=label]').value.trim(), planIds = [...dl.querySelectorAll('[name=plan]:checked')].map(x => x.value);
      if (!label || !planIds.length || ((kind === 'interval' || kind === 'tenure') && !months)) { alert('特典名・対象プラン・月数を入れてください'); return false; }
      const labelByPlan = {};
      data.settings.plans.forEach(p => { const v = dl.querySelector(`[name=lbp-${p.id}]`).value.trim(); if (v) labelByPlan[p.id] = v; });
      const id = ruleId || (kind === 'tenure' ? `tenure-${months}` : `${kind}-${Date.now().toString(36)}`);
      if (!ruleId && data.settings.rules.some(x => x.id === id)) { alert('同じ月数の継続特典がすでにあります'); return false; }
      return commit(withSettings(s => {
        const nr = { ...(ruleId ? s.rules.find(x => x.id === ruleId) : {}), id, kind, label, planIds, ...(months ? { months } : {}), ...(kind === 'tenure' ? { labelByPlan } : {}) };
        if (ruleId) s.rules = s.rules.map(x => (x.id === ruleId ? nr : x)); else s.rules.push(nr);
      }));
    },
  });
  const sync = () => { const k = d.querySelector('[name=kind]').value; d.querySelector('.months').style.display = k === 'interval' || k === 'tenure' ? '' : 'none'; d.querySelector('.perplan').style.display = k === 'tenure' ? '' : 'none'; };
  d.querySelector('[name=kind]').onchange = sync; sync();
  const del = d.querySelector('#delRule');
  if (del) del.onclick = () => { if (confirm('このルールを削除しますか？（渡した記録は残ります）')) { d.close(); commit(withSettings(s => { s.rules = s.rules.filter(x => x.id !== ruleId); })); } };
}

function openExtra() {
  const fans = Object.values(data.fans).filter(f => f.status !== 'left').sort((a, b) => Number(a.memberNo) - Number(b.memberNo) || compare(a.memberNo, b.memberNo));
  const d = openDialog('特典を追加（ルーレット当選など）', `
    <label>内容<input name="title" placeholder="例：ルーレット当選：直筆チェキ" required></label>
    <label>いつまでに渡す<input type="date" name="due" value="${endOfMonth(today)}" required></label>
    <div class="field">誰に（複数選べます）<input id="fanSearch" placeholder="名前で絞り込み" style="display:block;width:100%;margin-top:4px"></div>
    <div class="fanpick">${fans.map(f => `<label class="inline-row"><input type="checkbox" name="fan" value="${h(f.memberNo)}"> ${h(f.name)} ${badge(planOn(f, today) || f.planHistory.at(-1).planId)}</label>`).join('')}</div>`, {
    ok: '追加する', wide: true, onOk: dl => {
      const ids = [...dl.querySelectorAll('[name=fan]:checked')].map(x => x.value);
      const title = dl.querySelector('[name=title]').value.trim(), due = dl.querySelector('[name=due]').value;
      if (!ids.length) { alert('渡す人を選んでください'); return false; }
      if (!title || !due) { alert('内容と期限を入れてください'); return false; }
      return commit(addExtra(data, ids, { title, due }, ctx()));
    },
  });
  d.querySelector('#fanSearch').oninput = e => {
    const q = e.target.value.trim();
    d.querySelectorAll('.fanpick label').forEach(l => { l.style.display = !q || l.textContent.includes(q) ? '' : 'none'; });
  };
}

if (typeof startApp === 'function') window.addEventListener('DOMContentLoaded', () => startApp(window.__TEST_DISK__ ? createMemoryStorage({ disk: window.__TEST_DISK__, deviceName: 'PC-TEST' }) : productionStorage()));
})();</script>
</body>
